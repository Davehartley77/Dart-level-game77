<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f3d2a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Saved by the Bull">
<link rel="apple-touch-icon" href="images/icon.png">
<link rel="manifest" href="manifest.json">
<title>Saved by the Bull</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Bangers&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700;800&display=swap">
<link rel="icon" id="favicon" href="images/icon.png">
<style>
  :root {
    --felt: #0f3d2a;
    --felt-2: #144d35;
    --panel: #1a5a3f;
    --line: #2c7a56;
    --bone: #fff4d6;
    --bone-2: #f3e5bb;
    --ink: #14110c;
    --red: #e8362c;
    --red-2: #ff5c4f;
    --green: #21a55e;
    --green-2: #35c877;
    --brass: #f2b83b;
    --brass-2: #ffd45c;
    --muted: #b7d3c0;
    --shadow: 0 10px 30px rgba(0,0,0,.45);
    --display: "Bungee", "Impact", "Arial Black", sans-serif;
    --body: "Barlow", "Helvetica Neue", Arial, sans-serif;
    --num: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  @supports (padding: env(safe-area-inset-left)) { .wrap { padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); padding-bottom: max(60px, env(safe-area-inset-bottom)); } }
  html { color-scheme: dark; }
  body {
    margin: 0;
    background: var(--felt);
    background-image:
      radial-gradient(ellipse at 50% -10%, rgba(255,212,92,.28), transparent 55%),
      radial-gradient(ellipse at 100% 100%, rgba(232,54,44,.18), transparent 50%),
      repeating-linear-gradient(45deg, rgba(255,255,255,.02) 0 2px, transparent 2px 6px);
    color: var(--bone);
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.45;
    min-height: 100vh;
  }
  button { font: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--brass-2); outline-offset: 2px; }
  [hidden] { display: none !important; }

  .wrap { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }

  /* ---------- header ---------- */
  .masthead { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 6px 0 12px; border-bottom: 2px solid var(--brass); margin-bottom: 20px; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand h1 { font-family: "Bangers", var(--display); font-size: clamp(34px, 7vw, 64px); margin: 0; letter-spacing: .04em; color: var(--bone); line-height: .95; transform: skewX(-7deg) rotate(-2deg); transform-origin: left bottom;
    text-shadow: 2px 2px 0 var(--ink), 4px 4px 0 var(--ink), 6px 6px 0 rgba(0,0,0,.35); -webkit-text-stroke: 1px rgba(0,0,0,.35); }
  .brand h1 span { color: var(--brass-2); display: inline-block; transform: rotate(3deg) translateY(2px); }
  .brand h1 em { font-style: normal; color: var(--red-2); }
  .bully-mark { width: 150px; flex: none; filter: drop-shadow(0 6px 10px rgba(0,0,0,.55)); margin: -10px 0 -18px; }
  .bully-mark svg { width: 100%; height: auto; display: block; }
  @media (max-width: 520px) { .bully-mark { width: 104px; margin: -6px 0 -12px; } }
  .brand { align-items: flex-end; }
  /* Bully as a big faint watermark in the corner */
  #bullyWatermark { position: fixed; left: 50%; transform: translateX(-50%); bottom: -112vmin; width: 210vmin; opacity: .92; pointer-events: none; z-index: 0; filter: drop-shadow(0 0 40px rgba(0,0,0,.5)); }
  @media (min-aspect-ratio: 1/1) { #bullyWatermark { left: auto; right: -6vw; transform: none; bottom: -92vmin; width: 170vmin; } }
  /* cards get a little more body so they read over a full-colour Bully */
  .card, .pcard { background: rgba(26,90,63,.94); }
  .turn { box-shadow: 0 10px 30px rgba(0,0,0,.55), 0 0 0 1px rgba(0,0,0,.3); }
  .masthead { background: rgba(15,61,42,.6); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); border-radius: 12px; padding-left: 12px; padding-right: 12px; }
  #bullyWatermark svg { width: 100%; height: auto; display: block; }
  .wrap { position: relative; z-index: 1; }
  .avatar svg { width: 100%; height: 100%; display: block; }
  .bully-pose { margin: 0 auto 6px; width: 120px; }
  .bully-pose svg { width: 100%; height: auto; display: block; filter: drop-shadow(0 6px 10px rgba(0,0,0,.35)); }
  .bully-mark.loaded { display: block; }
  .avatar img, .who .avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block; }
  .meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; width: 100%; padding-top: 10px; border-top: 1px solid rgba(255,255,255,.08); }
  .chip, .btn-ghost { height: 36px; display: inline-flex; align-items: center; gap: 6px; border-radius: 8px; font-family: var(--num); font-weight: 700; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; padding: 0 12px; white-space: nowrap; }
  .chip { border: 1px solid transparent; background: rgba(0,0,0,.25); color: var(--bone-2); }
  .chip strong { color: var(--brass-2); font-size: 17px; }
  .chip + .btn-ghost { margin-left: auto; }
  .btn-ghost { background: rgba(255,255,255,.05); border: 1px solid var(--line); color: var(--bone); cursor: pointer; }
  .btn-ghost:hover { border-color: var(--brass); color: var(--brass-2); background: rgba(242,184,59,.08); }
  .btn-ghost[aria-pressed="true"] { border-color: var(--brass); color: var(--brass-2); background: rgba(242,184,59,.14); }
  .btn-ghost:disabled { opacity: .4; cursor: not-allowed; }
  @media (max-width: 520px) { .chip, .btn-ghost { height: 34px; font-size: 13px; padding: 0 10px; } .chip + .btn-ghost { margin-left: 0; } }

  /* ---------- buttons ---------- */
  .btn { border: none; border-radius: 10px; padding: 14px 22px; font-family: var(--num); font-weight: 800; font-size: 20px; letter-spacing: .06em; text-transform: uppercase; color: var(--bone); background: var(--green); box-shadow: 0 4px 0 #14502f, var(--shadow); transition: transform .08s, box-shadow .08s; }
  .btn:hover { background: var(--green-2); }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #14502f; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.red { background: var(--red); box-shadow: 0 4px 0 #7f1f1a, var(--shadow); }
  .btn.red:hover { background: var(--red-2); }
  .btn.brass { background: var(--brass); color: var(--ink); box-shadow: 0 4px 0 #7d6229, var(--shadow); }
  .btn.brass:hover { background: var(--brass-2); }
  .btn.quiet { background: #d9cdae; color: var(--ink); box-shadow: 0 4px 0 #a8996f, var(--shadow); }
  .btn.quiet:hover { background: #e6dcc2; }

  /* ---------- setup ---------- */
  .setup { display: grid; grid-template-columns: 1.1fr .9fr; gap: 22px; align-items: start; }
  @media (max-width: 760px) { .setup { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; box-shadow: var(--shadow); }
  .card h2 { font-family: var(--num); font-weight: 800; font-size: 15px; letter-spacing: .14em; text-transform: uppercase; color: var(--brass-2); margin: 0 0 14px; }
  .span2 { grid-column: 1 / -1; }
  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 520px) { .modes { grid-template-columns: 1fr; } }
  .mode { border: 2px solid var(--line); background: var(--felt); color: var(--bone); border-radius: 14px; padding: 16px 18px; text-align: left; display: grid; gap: 4px; }
  .mode .t { font-family: var(--display); font-size: 20px; line-height: 1.1; }
  .mode .d { color: var(--muted); font-size: 14px; }
  .mode[aria-pressed="true"] { border-color: var(--brass); background: var(--bone); color: var(--ink); }
  .mode[aria-pressed="true"] .d { color: #6b5a2c; }
  .field { display: flex; gap: 10px; }
  .field input { flex: 1; min-width: 0; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--felt); color: var(--bone); font-size: 18px; }
  .field input::placeholder { color: var(--muted); }
  .swatches { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0 6px; }
  .swatch { width: 34px; height: 34px; border-radius: 50%; border: 3px solid transparent; padding: 0; }
  .swatch[aria-pressed="true"] { border-color: var(--bone); box-shadow: 0 0 0 2px var(--ink); }
  .icons { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .icon-btn { font-size: 22px; width: 42px; height: 42px; border-radius: 10px; border: 1px solid var(--line); background: var(--felt); }
  .icon-btn[aria-pressed="true"] { background: var(--bone); border-color: var(--brass); }
  .roster { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 8px; }
  .roster li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--felt); border-radius: 10px; border: 1px solid var(--line); }
  .roster .dot { width: 14px; height: 14px; border-radius: 50%; flex: none; }
  .roster .name { flex: 1; font-weight: 600; font-size: 17px; }
  .remove { background: none; border: none; color: var(--muted); font-size: 18px; padding: 2px 6px; }
  .remove:hover { color: var(--red-2); }
  .empty { color: var(--muted); font-style: italic; margin: 16px 0 0; }

  .opts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .opt { border: 2px solid var(--line); background: var(--felt); color: var(--bone); border-radius: 12px; padding: 14px 6px 10px; text-align: center; font-family: var(--num); font-weight: 800; font-size: 34px; line-height: 1; }
  .opt small { display: block; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-top: 6px; font-weight: 600; }
  .opt[aria-pressed="true"] { border-color: var(--brass); background: var(--bone); color: var(--ink); }
  .opt[aria-pressed="true"] small { color: #6b5a2c; }
  .opts.small .opt { font-size: 24px; padding: 10px 6px 8px; }
  .custom { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
  .custom input { width: 110px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--felt); color: var(--bone); font-family: var(--num); font-size: 24px; font-weight: 700; }
  .custom label { color: var(--muted); font-size: 14px; }
  .sub-h { font-family: var(--num); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin: 16px 0 8px; }
  .sub-h:first-of-type { margin-top: 0; }

  .rules-table { width: 100%; border-collapse: collapse; font-family: var(--num); font-size: 17px; }
  .rules-table th, .rules-table td { padding: 8px 6px; text-align: center; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  .rules-table th { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .rules-table td:first-child { color: var(--brass-2); font-weight: 800; }
  .rules-table .plus { color: var(--green-2); font-weight: 700; }
  .rules-table .minus { color: var(--red-2); font-weight: 700; }
  .rules-note { color: var(--muted); font-size: 14px; margin: 12px 0 0; }
  .start-row { grid-column: 1 / -1; display: flex; justify-content: center; padding-top: 6px; }

  /* ---------- play ---------- */
  .play { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); gap: 22px; align-items: start; }
  @media (max-width: 860px) { .play { grid-template-columns: 1fr; } }

  .turn { background: var(--bone); color: var(--ink); border-radius: 16px; padding: 20px; box-shadow: var(--shadow); border: 4px solid var(--brass); position: relative; overflow: hidden; }
  .turn-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .who { display: flex; align-items: center; gap: 12px; }
  .who .avatar { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-size: 24px; box-shadow: inset 0 0 0 3px rgba(0,0,0,.25); font-family: var(--num); font-weight: 800; color: var(--ink); }
  .who .label { font-family: var(--num); font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: #6b5a2c; font-weight: 700; }
  .who .pname { font-family: var(--display); font-size: clamp(18px, 3vw, 26px); line-height: 1.05; }
  .level-pill { font-family: var(--num); font-weight: 800; font-size: 17px; letter-spacing: .08em; text-transform: uppercase; background: var(--ink); color: var(--brass-2); padding: 8px 14px; border-radius: 999px; }

  .stage { display: grid; grid-template-columns: 220px 1fr; gap: 18px; align-items: center; margin-top: 16px; }
  @media (max-width: 520px) { .stage { grid-template-columns: 1fr; justify-items: center; } }
  canvas.board { width: 220px; height: 220px; border-radius: 50%; box-shadow: 0 6px 20px rgba(0,0,0,.35); }
  .target-box { text-align: center; }
  .target-box .label { font-family: var(--num); font-size: 14px; letter-spacing: .18em; text-transform: uppercase; color: #6b5a2c; font-weight: 700; }
  .target-box .target { font-family: var(--display); font-size: clamp(64px, 12vw, 110px); line-height: 1; color: var(--red); text-shadow: 0 4px 0 rgba(0,0,0,.18); }
  .target-box .worth { font-family: var(--num); font-size: 16px; color: #4a3f22; font-weight: 600; }
  .target-box .worth b { color: var(--green); }
  .target-box .worth i { color: var(--red); font-style: normal; }

  .submit-row { margin-top: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 420px) { .submit-row { grid-template-columns: 1fr; } }
  .letters { display: inline-flex; gap: 3px; font-family: var(--num); font-weight: 800; font-size: 22px; letter-spacing: .02em; }
  .letters span { width: 24px; height: 30px; display: grid; place-items: center; border-radius: 5px; background: var(--red); color: var(--bone); }
  .letters span.off { background: rgba(0,0,0,.18); color: rgba(0,0,0,.35); }
  .pcard .letters span { width: 18px; height: 24px; font-size: 16px; }
  .pcard .letters span.off { background: rgba(255,255,255,.08); color: rgba(255,255,255,.25); }
  .num-badge { font-family: var(--display); font-size: 30px; color: var(--ink); background: var(--bone); border: 3px solid var(--brass); border-radius: 12px; padding: 4px 12px; line-height: 1; }
  .pcard .num-badge { font-size: 22px; padding: 3px 9px; }
  .killer-tag { font-family: var(--num); font-weight: 800; letter-spacing: .12em; text-transform: uppercase; font-size: 12px; color: var(--red); }
  .pcard.out { opacity: .45; }
  .targets-k { display: grid; gap: 8px; margin-top: 14px; }
  .target-k { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; background: rgba(0,0,0,.06); border-radius: 12px; padding: 8px 10px; }
  .target-k .tn { font-family: var(--display); font-size: 22px; min-width: 44px; text-align: center; }
  .target-k .tname { font-weight: 700; }
  .target-k .tsub { font-size: 13px; color: #6b5a2c; }
  .sdt { display: flex; gap: 6px; }
  .sdt button { width: 46px; height: 44px; border-radius: 10px; border: 2px solid #b9ad8f; background: #fbf6e8; color: var(--ink); font-family: var(--num); font-weight: 800; font-size: 18px; }
  .sdt button:hover { border-color: var(--brass); background: #fff; }
  .sdt button:disabled { opacity: .35; cursor: not-allowed; }
  .pick-pad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 14px; }
  .pick-pad button { height: 50px; border-radius: 10px; border: 2px solid #b9ad8f; background: #fbf6e8; color: var(--ink); font-family: var(--num); font-weight: 800; font-size: 22px; }
  .pick-pad button:disabled { opacity: .3; cursor: not-allowed; text-decoration: line-through; }
  .darts-left { display: flex; gap: 6px; }
  .darts-left i { width: 14px; height: 14px; border-radius: 50%; background: var(--red); display: inline-block; }
  .darts-left i.used { background: rgba(0,0,0,.2); }
  .submit-row.three { grid-template-columns: 1fr 1fr 1fr; }
  @media (max-width: 640px) { .submit-row.three { grid-template-columns: 1fr; } }
  .submit-row .btn { padding: 22px 12px; font-size: 26px; }
  .submit-row .btn.brass { font-size: 20px; line-height: 1.1; }
  .submit-row .btn small { display: block; font-size: 13px; letter-spacing: .12em; opacity: .85; margin-top: 4px; }
  .hint { text-align: center; color: #6b5a2c; font-size: 14px; margin: 12px 0 0; }

  /* 501 */
  .req { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center; margin-top: 14px; }
  @media (max-width: 520px) { .req { grid-template-columns: 1fr; } }
  .req .label { font-family: var(--num); font-size: 14px; letter-spacing: .18em; text-transform: uppercase; color: #6b5a2c; font-weight: 700; }
  .req .n { font-family: var(--display); font-size: clamp(64px, 12vw, 104px); line-height: 1; color: var(--ink); font-variant-numeric: tabular-nums; }
  .req .n.finish { color: var(--red); }
  .suggest { background: var(--ink); color: var(--bone); border-radius: 12px; padding: 12px 16px; min-width: 220px; }
  .suggest .label { color: var(--brass-2); font-family: var(--num); font-size: 12px; letter-spacing: .16em; text-transform: uppercase; font-weight: 700; }
  .suggest .route { font-family: var(--num); font-size: 28px; font-weight: 800; line-height: 1.15; margin-top: 4px; }
  .suggest .route.small { font-size: 20px; }
  .suggest .why { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .suggest.finish { background: var(--green); }
  .suggest.finish .label { color: var(--bone); opacity: .85; }
  .suggest.finish .why { color: rgba(237,227,203,.85); }

  .entry { margin-top: 16px; display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: stretch; }
  @media (max-width: 560px) { .entry { grid-template-columns: 1fr; } }
  .scored { background: var(--ink); color: var(--bone); border-radius: 12px; padding: 10px 16px; display: flex; flex-direction: column; justify-content: center; gap: 8px; }
  .scored .label { font-family: var(--num); font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .scored .value { font-family: var(--num); font-size: 60px; font-weight: 800; line-height: 1; min-height: 60px; font-variant-numeric: tabular-nums; }
  .scored .value.empty { color: #4d5a50; }
  .scored .msg { font-size: 14px; color: var(--red-2); min-height: 20px; font-weight: 600; }
  .quick { display: flex; flex-wrap: wrap; gap: 6px; }
  .quick button { border: 1px solid #3a5544; background: var(--felt-2); color: var(--bone-2); border-radius: 8px; padding: 6px 10px; font-family: var(--num); font-weight: 700; font-size: 16px; }
  .quick button:hover { border-color: var(--brass); color: var(--brass-2); }
  .pad { display: grid; grid-template-columns: repeat(3, 64px); gap: 8px; }
  .pad button { height: 52px; border-radius: 10px; border: 2px solid #b9ad8f; background: #fbf6e8; color: var(--ink); font-family: var(--num); font-weight: 800; font-size: 26px; }
  .pad button:hover { background: #fff; border-color: var(--brass); }
  .pad button.del { font-size: 18px; background: #e9dfc4; }
  .pad button.mic { font-size: 20px; background: #e9dfc4; }
  .pad button.mic[aria-pressed="true"] { background: var(--red); color: var(--bone); border-color: var(--red); }
  .x01-row { margin-top: 14px; display: grid; grid-template-columns: 2fr 1fr; gap: 10px; }
  .x01-row .btn { padding: 18px 16px; font-size: 24px; }

  /* result overlay inside turn card */
  .result { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 20px; background: var(--green); color: var(--bone); animation: pop .25s ease-out; z-index: 2; }
  .result.miss { background: var(--red); }
  .result.neutral { background: var(--ink); }
  .result.saved { background: var(--brass); color: var(--ink); }
  .result.saved .big { text-shadow: 0 4px 0 rgba(0,0,0,.15); }
  .result.saved .btn { background: var(--ink); color: var(--bone); }
  .result .big { font-family: var(--display); font-size: clamp(40px, 8vw, 72px); line-height: 1; text-shadow: 0 4px 0 rgba(0,0,0,.3); }
  .result .detail { font-family: var(--num); font-size: 22px; font-weight: 600; margin: 10px 0 18px; }
  .result .detail b { font-size: 30px; }
  .result .btn { background: var(--bone); color: var(--ink); box-shadow: 0 4px 0 rgba(0,0,0,.35); }
  .result .darts { display: flex; gap: 10px; justify-content: center; margin: 6px 0 16px; }
  .result .darts button { width: 64px; height: 64px; border-radius: 12px; border: 3px solid rgba(255,255,255,.5); background: transparent; color: var(--bone); font-family: var(--num); font-size: 30px; font-weight: 800; }
  .result .darts button:hover { background: rgba(255,255,255,.15); }
  @keyframes pop { from { transform: scale(.94); opacity: 0; } to { transform: none; opacity: 1; } }
  .result.mega { background: radial-gradient(circle at 50% 40%, #ffe27a, var(--brass) 55%, #d9901e); color: var(--ink); }
  .result.mega .big { font-size: clamp(56px, 12vw, 120px); text-shadow: 0 6px 0 rgba(0,0,0,.2); animation: thump .5s ease-out 3; }

<script>
(function () {

  // ---------- Saved by the Bull rules ----------
  const LEVELS = [

    do { t = Math.floor(Math.random() * (L.max - L.min + 1)) + L.min; } while (L.even && t % 2 !== 0);

  // What to do from any remaining score.
  function suggestion(rem) {
    if (rem <= 1) return null;

    if (rem > 350) return { finish: false, route: "Big scoring: treble 20", why: `${rem} needs more than one visit` };

    for (const need of [180, 140, 100, 60, 120, 121, 125, 85, 81, 45, 41, 26, 133, 137, 160, 177, 174, 171, 20]) {
      const L = rem - need;
      if (L >= 2 && CHECKOUTS[L]) return { finish: false, route: `Score ${need} to leave ${L}`, why: `${L} is ${routePretty(CHECKOUTS[L])}` };

    }

  }
  function routeWords(route) {

  // ---------- Bully, drawn in vector (design/mascot-draft.html is the character sheet) ----------

  // ---------- dartboard ----------
  function drawBoard(canvas) {
    if (!canvas) return;
    const dpr = window.devicePixelRatio || 1, size = 220;
    canvas.width = size * dpr; canvas.height = size * dpr;
    const g = canvas.getContext("2d"); g.scale(dpr, dpr);
    const cx = size / 2, cy = size / 2, R = size / 2 - 2;
    const nums = [20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5];
    const seg = Math.PI * 2 / 20, start = -Math.PI / 2 - seg / 2;
    const ring = (r0, r1, i, color) => {
      g.beginPath(); g.arc(cx, cy, r1, start + i * seg, start + (i + 1) * seg);
      g.arc(cx, cy, r0, start + (i + 1) * seg, start + i * seg, true); g.closePath();
      g.fillStyle = color; g.fill(); g.strokeStyle = "#b8b8b0"; g.lineWidth = .6; g.stroke();
    };
    g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.fillStyle = "#14110c"; g.fill();
    const rNum = R, rDbl1 = R * .80, rDbl0 = R * .74, rTrb1 = R * .50, rTrb0 = R * .44, rBull = R * .085, rBullO = R * .17;
    for (let i = 0; i < 20; i++) {
      const dark = i % 2 === 0;
      ring(rBullO, rTrb0, i, dark ? "#14110c" : "#ede3cb");
      ring(rTrb0, rTrb1, i, dark ? "#c8322b" : "#237d4f");
      ring(rTrb1, rDbl0, i, dark ? "#14110c" : "#ede3cb");
      ring(rDbl0, rDbl1, i, dark ? "#c8322b" : "#237d4f");
    }
    g.beginPath(); g.arc(cx, cy, rBullO, 0, Math.PI * 2); g.fillStyle = "#237d4f"; g.fill();
    g.beginPath(); g.arc(cx, cy, rBull, 0, Math.PI * 2); g.fillStyle = "#c8322b"; g.fill();
    g.fillStyle = "#ede3cb"; g.font = "700 11px 'Barlow Condensed', 'Arial Narrow', sans-serif"; g.textAlign = "center"; g.textBaseline = "middle";
    for (let i = 0; i < 20; i++) {
      const a = -Math.PI / 2 + i * seg, r = (rNum + rDbl1) / 2 + 1;
      g.fillText(String(nums[i]), cx + Math.cos(a) * r, cy + Math.sin(a) * r);
    }
  }

  function renderDialog(d) {
    let title, text, ok, okClass = "red";
    if (d.type === "end") { title = "End this game?"; text = "Scores will be lost. Use Save and close instead if you want to pick it up later."; ok = "End game"; }
    else if (d.type === "leave") { const p = state.players[d.index]; title = `${p ? esc(p.name) : "Player"} leaving?`; text = "They drop out of the game. Everyone else carries on and their throws stay in the history."; ok = "Yes, leave the game"; }
    else if (d.type === "deleteSaved") { const s = savedGames.find(g => g.id === d.id); title = "Delete saved game?"; text = s ? `${esc(s.title)}. This can't be undone.` : ""; ok = "Delete"; }
    else if (d.type === "save") { title = "Save and close?"; text = "The game is kept on this device under Saved games on the start screen. Resume it any time."; ok = "Save and close"; okClass = ""; }
    return `<div class="dialog" role="dialog" aria-label="${title}"><div class="inner">
      <h3>${title}</h3><p>${text}</p>

  // ---------- undo ----------
  // A snapshot is taken before every throw is recorded; Undo puts the game back exactly as it was.
  function snapshot(label) {
    const snap = { label, players: JSON.parse(JSON.stringify(state.players)), current: state.current, rounds: state.rounds.slice(), round: state.round, leg: state.leg, legStarter: state.legStarter, killer: { ...state.killer } };
    state.undo = (state.undo || []).concat([snap]).slice(-30);
  }
  function undo() {
    if (!state.undo || !state.undo.length || state.dialog) return;
    const snap = state.undo[state.undo.length - 1];
    state.undo = state.undo.slice(0, -1);
    if (canSpeak) { try { speechSynthesis.cancel(); } catch (e) { /* ignore */ } }
    set({ players: snap.players, current: snap.current, rounds: snap.rounds, round: snap.round, leg: snap.leg, legStarter: snap.legStarter, killer: snap.killer || state.killer, result: null, winner: null, entry: "", msg: `Undone: ${snap.label}. ${state.players[snap.current] ? state.players[snap.current].name : ""} to throw again.` });
    say(["undone", { name: state.players[state.current].name }, "to-throw-again"], { interrupt: true });
  }
  function undoLink() { return state.undo && state.undo.length ? `<button type="button" class="undo" data-undo="1">Wrong? Undo that</button>` : ""; }

  // ---------- celebrations ----------
  function confetti(n) {
    const box = document.createElement("div"); box.className = "confetti";
    const cols = ["#ff4d3d", "#ffd45c", "#37d67a", "#4da3ff", "#fff4d6", "#ff8c2e"];
    for (let i = 0; i < (n || 80); i++) {
      const p = document.createElement("i");
      p.style.left = Math.random() * 100 + "vw"; p.style.background = cols[i % cols.length];
      p.style.animationDuration = (1.6 + Math.random() * 1.6) + "s"; p.style.animationDelay = (Math.random() * .6) + "s";
      p.style.transform = `rotate(${Math.random() * 360}deg)`; p.style.width = (6 + Math.random() * 8) + "px";
      box.appendChild(p);
    }
    document.body.appendChild(box); setTimeout(() => box.remove(), 3600);
    document.body.classList.remove("flash"); void document.body.offsetWidth; document.body.classList.add("flash");
  }
  function big180(name) {
    sfx.crowd(2.6); confetti(120);
    playClip("180").then(played => { if (!played) say([180], { pitch: 1.15, rate: 0.8 }); });
  }
  const numberWord = n => n === 100 ? "a ton" : n === 140 ? "ton forty" : n === 160 ? "ton sixty" : String(n);
  // The line the caller says after a scoring visit in 501
  function callVisit(scored, p, s) {
    // With voice control on the caller only echoes the score it heard; the screen shows the rest.
    if (scored === 180) { big180(p.name); return; }
    if (scored >= 171) { sfx.crowd(1.6); say([scored, "wonderful-darts"], { pitch: 1.1, rate: 0.9 }); return; }
    if (scored >= 140) { sfx.crowd(1.4); say(scored === 140 ? ["ton-forty"] : scored === 160 ? ["ton-sixty"] : [scored], { pitch: 1.08, rate: 0.9 }); return; }
    if (scored >= 100) { playClip("ton").then(played => { if (!played) say(scored === 100 ? ["a-ton"] : [scored], { pitch: 1.04 }); }); return; }
    if (scored === 26) { say(["bed-and-breakfast"]); return; }
    say([scored]);
  }

  // ---------- game flow: Saved by the Bull ----------
  // outcome: "hit" | "miss" | "bull" (checkout impossible with the darts left, but the bull was hit: nothing changes)
  function submitBull(outcome) {
    if (state.result || state.dialog || state.winner != null) return;
    const p = state.players[state.current];
    const L = LEVELS[p.level - 1];
    const before = p.level;
    const hit = outcome === "hit", saved = outcome === "bull";
    state.bullyMood = p.bot ? (hit ? "celebrating" : saved ? "smug" : "sulking") : (hit && p.level >= 4 ? "wince" : hit ? "waiting" : "smug");
    snapshot(`${p.name} ${hit ? "hit" : saved ? "saved by the bull on" : "missed"} ${p.target}`);
    let delta = 0;
    if (hit) { delta = L.points; p.score += delta; if (p.level < 5) p.level++; sfx.hit(); if (before >= 4) { sfx.crowd(1.6); confetti(60); } }
    else if (saved) { sfx.hit(); sfx.crowd(1.4); }
    else { delta = L.penalty; p.score = Math.max(0, p.score - delta); p.level = L.failTo; sfx.miss(); }
    const usedTarget = p.target;
    if (!(saved && state.bullKeep)) p.target = randomTarget(p.level);
    const result = { player: p.name, hit, saved, delta, level: p.level, fromLevel: before, levelUp: p.level > before, levelDown: p.level < before, score: p.score, target: usedTarget, round: state.round };
    state.rounds.push(result);
    if (p.score >= state.targetScore) { state.winner = state.current; state.result = null; set({}); setTimeout(sfx.win, 150); sfx.crowd(3); confetti(150); playClip("gameshot").then(pl => { if (!pl) say(["game-shot", { name: p.name }, "wins", "with", p.score, "points"], { pitch: 1.12, rate: 0.85 }); }); return; }
    if (state.listenMode && !saved && !(hit && before >= 4)) say(hit ? ["hit"] : ["missed"]);
    else if (hit && before === 5) say(["what-a-checkout", usedTarget, delta, "points"], { pitch: 1.12, rate: 0.85 });
    else if (hit && before === 4) say(["yes", usedTarget, delta, "points"], { pitch: 1.06 });
    else if (hit) say(["hit", delta, "points"]);
    else if (saved) playClip("saved").then(pl => { if (!pl) say(["saved", { name: p.name }, "stays-on-level", p.level], { pitch: 1.1, rate: 0.88 }); });
    else say(delta ? ["missed", "minus", delta, "points"] : ["missed", "no-points-lost"]);
    set({ result });
  }

  // ---------- game flow: 501 ----------
  function submitX01(scored) {
    if (state.result || state.dialog || state.winner != null) return;
    const p = state.players[state.current];
    let bust = scored === "bust";
    if (!bust) {
      if (!(scored >= 0 && scored <= 180)) { set({ msg: "A three-dart score is 0 to 180." }); return; }
      if (IMPOSSIBLE_SCORES.has(scored)) { set({ msg: `${scored} can't be scored with three darts.` }); return; }
      const left = p.remaining - scored;
      if (left < 0 || left === 1) bust = true;
      else if (left === 0) {
        if (scored > 170 || !CHECKOUTS[scored]) { set({ msg: `${scored} isn't a finish. Enter what you scored, or Bust.` }); return; }
        snapshot(`${p.name} checked out ${scored}`);
        state.bullyMood = p.bot ? "celebrating" : "wince";
        p.remaining = 0; p.pointsScored += scored;
        const r = { player: p.name, scored, checkout: true, leg: state.leg };
        sfx.hit(); sfx.crowd(2.4); confetti(scored >= 100 ? 140 : 70);
        const key = scored === 170 ? "bigfish" : "gameshot";
        playClip(key).then(pl => { if (!pl) say(scored === 170 ? ["the-big-fish"] : scored >= 100 ? ["what-a-finish", scored, "game-shot"] : ["game-shot"], { pitch: 1.12, rate: 0.85 }); });
        set({ result: r, entry: "", msg: "" });
        return;
      }
    }
    snapshot(`${p.name} ${bust ? "bust" : "scored " + scored}`);
    state.bullyMood = p.bot ? (bust ? "sulking" : scored >= 100 ? "celebrating" : "waiting") : (bust ? "smug" : scored >= 140 ? "wince" : "waiting");
    const pointsHit = bust ? 0 : scored;
    if (!bust) p.remaining -= scored;
    p.dartsThrown += 3; p.pointsScored += pointsHit; p.last = bust ? 0 : scored;
    const s = suggestion(p.remaining);
    const r = { player: p.name, scored: bust ? 0 : scored, bust, remaining: p.remaining, suggest: s ? (s.finish ? routePretty(s.route) : s.route) : "" };
    state.rounds.push(r);
    if (bust) { sfx.miss(); playClip("bust").then(pl => { if (!pl) say(state.listenMode ? ["bust"] : ["no-score-bust"]); }); }
    else { if (scored >= 100) sfx.hit(); else sfx.tap(); callVisit(scored, p, s); }
    set({ result: r, entry: "", msg: "" });
  }
  function finishLeg(darts) {
    const p = state.players[state.current];
    const scored = state.result ? state.result.scored : 0;
    snapshot(`${p.name} won leg ${state.leg}`);
    p.dartsThrown += darts; p.legs++;
    state.rounds.push({ player: p.name, legWon: true, leg: state.leg, darts, scored });
    if (p.legs >= state.x01.legs) { state.winner = state.current; state.result = null; set({}); setTimeout(sfx.win, 150); sfx.crowd(3); confetti(160); say(["game-shot-match", { name: p.name }], { pitch: 1.12, rate: 0.82 }); return; }
    say([{ name: p.name }, "takes-leg"], { pitch: 1.05 });
    // next leg: everyone back to the start, the starter alternates
    state.players.forEach(q => { q.remaining = state.x01.start; q.last = null; });
    const starter = (state.legStarter + 1) % state.players.length;
    set({ leg: state.leg + 1, legStarter: starter, current: starter, result: null, rounds: [], entry: "", msg: "" });
    announceTurn();
  }


  // ---------- Killer ----------
  function lettersHtml(n) { return `<span class="letters" aria-label="${n} of 6 letters">${"KILLER".split("").map((c, i) => `<span class="${i < n ? "" : "off"}">${c}</span>`).join("")}</span>`; }
  function scoreboardKiller() {
    return `<div class="players">${state.players.map((q, i) => `
      <div class="pcard${i === state.current ? " active" : ""}${q.letters <= 0 ? " out" : ""}">
        ${avatar(q)}
        <div><div class="pname">${esc(q.name)}${q.bot ? ` <span class="lvl">bot ${q.botLevel}</span>` : ""} ${q.letters >= 6 ? `<span class="killer-tag">Killer</span>` : q.letters <= 0 ? `<span class="killer-tag" style="color:var(--muted)">Out</span>` : ""}</div><div class="sub">${lettersHtml(q.letters)}</div></div>
        <div class="score">${q.number ? `<span class="num-badge">${q.number}</span>` : `<span class="lvl">no number yet</span>`}</div>
        ${state.players.length > 1 && q.letters > 0 ? `<button type="button" class="leave" data-leave="${i}">Leave game</button>` : ""}
      </div>`).join("")}</div>`;
  }
  function renderPlayKiller() {
    const p = state.players[state.current];
    const k = state.killer;
    playMeta(`<span class="chip"><strong>KILLER</strong></span><span class="chip">Round <strong>${state.round}</strong></span>`);
    const taken = new Set(state.players.map(q => q.number).filter(Boolean));
    let body;
    if (k.phase === "pick") {
      body = `
        <div class="req"><div><div class="label">Throw one dart</div><div class="n" style="font-size:clamp(28px,6vw,44px)">${esc(p.name)}'s number</div></div></div>
        <p class="hint" style="text-align:left;margin-top:6px">${p.bot ? "Bully is picking…" : "Throw one dart at the board. Tap the number it landed in. A number someone already has means throw again."}</p>
        <div class="pick-pad">${Array.from({ length: 20 }, (_, i) => i + 1).map(n => `<button type="button" data-pick="${n}" ${taken.has(n) || p.bot ? "disabled" : ""}>${n}</button>`).join("")}</div>
        <div class="submit-row" style="grid-template-columns:1fr"><button class="btn quiet" id="pickMiss" type="button" ${p.bot ? "disabled" : ""}>Missed the board, throw again</button></div>`;
    } else {
      const isKiller = p.letters >= 6;
      const others = state.players.map((q, i) => ({ q, i })).filter(({ q, i }) => i !== state.current && q.letters > 0);
      body = `
        <div class="req">
          <div><div class="label">${isKiller ? "You are a killer. Get killing." : "You need more letters first"}</div><div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap"><span class="num-badge">${p.number}</span>${lettersHtml(p.letters)}</div></div>
          <div class="darts-left" aria-label="Darts left">${[0,1,2].map(i => `<i class="${i < k.darts ? "used" : ""}"></i>`).join("")}</div>
        </div>
        <div class="targets-k">
          <div class="target-k" style="background:rgba(232,54,44,.08)"><span class="tn">${p.number}</span><div><div class="tname">Own number</div><div class="tsub">${p.letters >= 6 ? "already full" : "single +1, double +2, treble +3"}</div></div>
            <div class="sdt">${[1,2,3].map(m => `<button type="button" data-kt="${state.current}" data-m="${m}" ${p.bot ? "disabled" : ""}>${"SDT"[m - 1]}</button>`).join("")}</div></div>
          ${isKiller ? others.map(({ q, i }) => `<div class="target-k"><span class="tn">${q.number}</span><div><div class="tname">${esc(q.name)}</div><div class="tsub">${q.letters} letter${q.letters === 1 ? "" : "s"} left</div></div>
            <div class="sdt">${[1,2,3].map(m => `<button type="button" data-kt="${i}" data-m="${m}" ${p.bot ? "disabled" : ""}>${"SDT"[m - 1]}</button>`).join("")}</div></div>`).join("")
          : `<p class="hint" style="text-align:left;margin:4px 0 0">Get all six letters back and the other players' numbers appear here.</p>`}
        </div>
        <div class="submit-row" style="grid-template-columns:1fr 1fr"><button class="btn red" id="kMiss" type="button" ${p.bot ? "disabled" : ""}>Miss<small>nothing hit</small></button><button class="btn quiet" id="kEnd" type="button" ${p.bot ? "disabled" : ""}>End turn<small>${3 - k.darts} dart${3 - k.darts === 1 ? "" : "s"} left</small></button></div>
        <p class="hint">Tap the number you hit, then S, D or T. Keyboard: a name's first letter isn't needed, just use the buttons. Voice: "Sue double", "own treble", "miss".</p>`;
    }
    app.innerHTML = `
      <section class="play">
        <div>
          <div class="turn">
            <div class="turn-head">
              <div class="who">${avatar(p)}<div><div class="label">On the oche</div><div class="pname">${esc(p.name)}</div></div></div>
              ${k.phase === "play" ? `<div class="level-pill">${p.letters >= 6 ? "Killer" : p.letters + " of 6"}</div>` : `<div class="level-pill">Numbers</div>`}
            </div>
            ${body}
            <p class="hint" id="voiceLine" style="color:var(--green);font-weight:600"></p>
            ${state.result ? renderResultKiller(state.result) : state.notice ? `<div class="result saved" role="status"><div><div class="big">${esc(state.notice.big)}</div><div class="detail">${esc(state.notice.detail)}</div><button class="btn" id="noticeOk" type="button">Carry on</button></div></div>` : ""}
          </div>
        </div>
        <aside class="side">
          <h2>Players</h2>${scoreboardKiller()}
          <h2>This game</h2>${historyList(k.phase === "pick" ? "Numbers first. Then the killing starts." : `No darts yet. ${esc(p.name)} throws first.`)}
        </aside>
      </section>
      ${state.winner != null ? renderWinner() : ""}
      ${state.dialog ? renderDialog(state.dialog) : ""}`;
    app.querySelectorAll("[data-pick]").forEach(b => b.addEventListener("click", () => pickNumber(+b.dataset.pick)));
    const pm = el("#pickMiss"); if (pm) pm.addEventListener("click", () => { say(["miss", { name: p.name }, "throw-one-dart"]); voiceState("Throw again."); });
    app.querySelectorAll("[data-kt]").forEach(b => b.addEventListener("click", () => submitKillerDart(+b.dataset.kt, +b.dataset.m)));
    const km = el("#kMiss"); if (km) km.addEventListener("click", () => submitKillerDart(null, 0));
    const ke = el("#kEnd"); if (ke) ke.addEventListener("click", () => endKillerTurn());
    const no = el("#noticeOk"); if (no) no.addEventListener("click", () => set({ notice: null }));
    wirePlay();
  }
  function renderResultKiller(r) {
    return `<div class="result ${r.cls === "miss" ? "miss" : r.cls === "hit" ? "hit" : "neutral"}" role="status"><div>
        ${botDartsLine()}
        <div class="big">${esc(r.big)}</div>
        <div class="detail">${esc(r.detail)}</div>
        <button class="btn" id="nextBtn" type="button">Next player</button>
        ${undoLink()}
    </div></div>`;
  }
  function pickNumber(n) {
    const p = state.players[state.current];
    if (state.players.some(q => q.number === n)) { voiceState(`${n} is taken. Throw again.`); return; }
    snapshot(`${p.name} picked ${n}`);
    p.number = n;
    state.rounds.push({ killer: true, player: p.name, text: `number ${n}`, tag: "picked", cls: "neutral" });
    say([{ name: p.name }, "your-number-is", n]);
    const remaining = state.players.filter(q => !q.number);
    if (remaining.length) {
      const next = state.players.findIndex(q => !q.number);
      set({ current: next, msg: "" });
      if (!state.players[next].bot) say([{ name: state.players[next].name }, "throw-one-dart"], { queue: true });
    } else {
      state.killer = { phase: "play", darts: 0 };
      set({ current: 0, round: 1 });
      say(["game-on"], { queue: true }); announceTurn();
    }
  }
  // one dart: targetIdx is a player index (own number included), mult 1/2/3; null = miss
  function submitKillerDart(targetIdx, mult) {
    if (state.result || state.dialog || state.winner != null || state.killer.phase !== "play") return;
    const p = state.players[state.current];
    const t = targetIdx == null ? null : state.players[targetIdx];
    snapshot(`${p.name}'s dart ${state.killer.darts + 1}`);
    state.killer.darts++;
    let text, tag, cls = "neutral", line = null;
    if (!t) { text = "missed"; tag = "miss"; cls = "miss"; }
    else if (t === p) {
      const before = p.letters; p.letters = Math.min(6, p.letters + mult);
      const got = p.letters - before;
      text = got ? `own ${["single", "double", "treble"][mult - 1]}, +${got} letter${got === 1 ? "" : "s"}${p.letters >= 6 ? " · back to KILLER" : ""}` : `own ${["single", "double", "treble"][mult - 1]}, already full`;
      tag = got ? (p.letters >= 6 ? "KILLER" : `+${got}`) : "full"; cls = got ? "hit" : "neutral";
      if (got) {
        if (p.letters >= 6) {
          const others = state.players.filter(q => q !== p && q.letters > 0).sort((a, b) => b.letters - a.letters);
          const victim = others.length ? others[Math.random() < 0.6 ? 0 : Math.floor(Math.random() * others.length)] : null;
          const stir = victim ? [["watch-out", { name: victim.name }], [{ name: victim.name }, "is-looking-nervous"], [{ name: victim.name }, "has-it-coming"], [{ name: victim.name }, "in-your-sights"]][Math.floor(Math.random() * 4)] : [];
          line = [{ name: p.name }, "is-a-killer", "get-killing"].concat(stir);
        } else line = [{ name: p.name }, "gets-back", got, got === 1 ? "letter" : "letters"];
      }
      if (got && p.letters >= 6) { sfx.crowd(1.6); confetti(60); state.notice = { big: "KILLER!", detail: `${p.name} has the full word back. Get killing!` }; setTimeout(() => { if (state.notice) set({ notice: null }); }, 2600); }
      if (p.bot) state.bullyMood = p.letters >= 6 ? "celebrating" : "waiting";
    } else if (p.letters < 6) {
      text = `hit ${t.name}'s ${["single", "double", "treble"][mult - 1]}, not a killer`; tag = "no effect"; cls = "neutral"; line = ["no-effect"];
    } else {
      const before = t.letters; t.letters = Math.max(0, t.letters - mult);
      const lost = before - t.letters;
      text = `${["single", "double", "treble"][mult - 1]} ${t.number}: ${t.name} loses ${lost}${t.letters <= 0 ? ", OUT" : ""}`; tag = `−${lost}`; cls = "hit";
      line = t.letters <= 0 ? [{ name: t.name }, "is-out"] : [{ name: t.name }, "loses", lost, lost === 1 ? "letter" : "letters"];
      if (t.bot) state.bullyMood = t.letters <= 0 ? "sulking" : "wince";
      if (p.bot) state.bullyMood = "celebrating";
    }
    state.rounds.push({ killer: true, player: p.name, text, tag, cls });
    if (line) say(line); else if (!t) sfx.miss();
    if (cls === "hit") sfx.hit();
    const alive = state.players.filter(q => q.letters > 0);
    if (alive.length === 1 && state.players.length > 1) {
      state.winner = state.players.indexOf(alive[0]); state.result = null; set({}); setTimeout(sfx.win, 150); sfx.crowd(3); confetti(150);
      say(["last-one-standing", { name: alive[0].name }, "wins"], { queue: true }); return;
    }
    if (state.killer.darts >= 3) endKillerTurn(); else set({});
  }
  function endKillerTurn() {
    const p = state.players[state.current];
    const mine = state.rounds.slice(-state.killer.darts).filter(r => r.killer && r.player === p.name);
    const summary = mine.map(r => r.tag).join(" · ") || "no darts";
    set({ result: { killer: true, big: p.letters >= 6 ? "KILLER" : p.letters > 0 ? `${p.letters} of 6` : "OUT", detail: `${p.name}: ${summary}`, cls: mine.some(r => r.cls === "hit") ? "hit" : mine.every(r => r.cls === "miss") && mine.length ? "miss" : "neutral" } });
  }
  function botKillerTurn(p) {
    const skill = botSkill(p.botLevel);
    if (state.killer.phase === "pick") {
      const free = Array.from({ length: 20 }, (_, i) => i + 1).filter(n => !state.players.some(q => q.number === n));
      pickNumber(free[Math.floor(Math.random() * free.length)]); return;
    }
    const throwOne = () => {
      if (state.result || state.winner != null || state.players[state.current] !== p || state.killer.darts >= 3) return;
      let aimNum;
      if (p.letters >= 6) { const others = state.players.filter(q => q !== p && q.letters > 0); others.sort((a, b) => b.letters - a.letters); aimNum = others.length ? others[0].number : p.number; }
      else aimNum = p.number;
      const d = throwDart({ kind: "T", n: aimNum }, skill);
      const num = d.label === "Bull" || d.label === "25" ? null : parseInt(d.label.replace(/[TD]/, ""), 10);
      const mult = d.label[0] === "T" ? 3 : d.label[0] === "D" ? 2 : 1;
      const idx = state.players.findIndex(q => q.number === num && q.letters > 0);
      state.botDarts = (state.botDarts ? state.botDarts + " · " : "") + d.label;
      submitKillerDart(idx >= 0 ? idx : null, mult);
      if (state.killer.darts < 3 && !state.result && state.winner == null) whenQuiet(throwOne, 900);
    };
    state.botDarts = ""; throwOne();
  }

  // ---------- shared flow ----------
  function nextTurn() {
    if (state.winner != null) return;
    let next = (state.current + 1) % state.players.length;
    if (state.mode === "killer") { let guard = 0; while (state.players[next].letters <= 0 && guard++ < state.players.length) next = (next + 1) % state.players.length; state.killer.darts = 0; state.notice = null; }
    set({ current: next, result: null, entry: "", msg: "", botDarts: "", round: next === 0 ? state.round + 1 : state.round });
    announceTurn();
  }
  function leaveGame(index) {
    const p = state.players[index]; if (!p) { set({ dialog: null }); return; }
    state.rounds.push({ player: p.name, left: true, round: state.round });
    state.players.splice(index, 1);
    if (!state.players.length) { resetToSetup(); return; }
    let current = state.current;
    if (index < current) current--;
    if (current >= state.players.length) current = 0;
    let starter = state.legStarter; if (index < starter) starter--; if (starter >= state.players.length) starter = 0;
    set({ current, legStarter: starter, result: index === state.current ? null : state.result, dialog: null, entry: "", msg: "" });
  }
  function resetPlayers() {
    state.players.forEach(p => { p.score = 0; p.level = 1; p.target = randomTarget(1); p.remaining = state.x01.start; p.legs = 0; p.dartsThrown = 0; p.pointsScored = 0; p.last = null; p.number = null; p.letters = 6; });
    state.killer = { phase: "pick", darts: 0 };
  }
  function playAgain() {
    resetPlayers();
    set({ current: 0, rounds: [], result: null, winner: null, round: 1, dialog: null, entry: "", msg: "", legStarter: 0, leg: 1, undo: [] });
    say(["game-on"]); announceTurn();
  }
  function resetToSetup() {
    resetPlayers();
    stopListening(); state.listenMode = false; stopBank();
    if (canSpeak) speechSynthesis.cancel();
    set({ screen: "setup", current: 0, rounds: [], result: null, winner: null, round: 1, dialog: null, entry: "", msg: "", legStarter: 0, leg: 1, undo: [] });
  }

  // keyboard shortcuts during play
  document.addEventListener("keydown", e => {
    if (state.page) { if (e.key === "Escape") set({ page: null }); return; }
    if (state.screen !== "play" || state.winner != null) return;
    if (e.target && (e.target.tagName === "INPUT")) return;
    if (state.dialog) { if (e.key === "Escape") set({ dialog: null }); return; }
    if (e.key.toLowerCase() === "u" || (e.key.toLowerCase() === "z" && (e.metaKey || e.ctrlKey))) { e.preventDefault(); undo(); return; }
    if (state.result) {
      if (state.result.checkout && /^[1-3]$/.test(e.key)) { e.preventDefault(); finishLeg(+e.key); return; }
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); nextTurn(); }
      return;
    }
    if (state.mode === "bull") {
      const k = e.key.toLowerCase();
      if (k === "h") { e.preventDefault(); submitBull("hit"); } else if (k === "m") { e.preventDefault(); submitBull("miss"); } else if (k === "b") { e.preventDefault(); submitBull("bull"); }
    } else {
      if (/^[0-9]$/.test(e.key)) { e.preventDefault(); const s = state.entry; if (s.length < 3) set({ entry: (s === "0" ? "" : s) + e.key, msg: "" }); }
      else if (e.key === "Backspace") { e.preventDefault(); set({ entry: state.entry.slice(0, -1) }); }
      else if (e.key === "Enter" && state.entry !== "") { e.preventDefault(); submitX01(parseInt(state.entry, 10)); }
      else if (e.key.toLowerCase() === "b") { e.preventDefault(); submitX01("bust"); }
    }
  });

  render();
})();
</script>
</body>
</html>
