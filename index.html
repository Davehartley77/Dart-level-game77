<title>Saved by the Bull</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700;800&display=swap">
<style>
  :root {
    --felt: #0e1a13;
    --felt-2: #142419;
    --panel: #1a2c21;
    --line: #2b4434;
    --bone: #ede3cb;
    --bone-2: #d9cdae;
    --ink: #14110c;
    --red: #c8322b;
    --red-2: #e04a42;
    --green: #237d4f;
    --green-2: #2f9a63;
    --brass: #c9a24b;
    --brass-2: #e3bf66;
    --muted: #93a596;
    --shadow: 0 10px 30px rgba(0,0,0,.45);
    --display: "Bungee", "Impact", "Arial Black", sans-serif;
    --body: "Barlow", "Helvetica Neue", Arial, sans-serif;
    --num: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body {
    margin: 0;
    background: var(--felt);
    background-image:
      radial-gradient(ellipse at 50% -10%, rgba(201,162,75,.16), transparent 60%),
      repeating-linear-gradient(45deg, rgba(255,255,255,.012) 0 2px, transparent 2px 6px);
    color: var(--bone);
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.45;
    min-height: 100vh;
  }
  button { font: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--brass-2); outline-offset: 2px; }
  [hidden] { display: none !important; }

  .wrap { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }

  /* ---------- header ---------- */
  .masthead { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 6px 0 18px; border-bottom: 2px solid var(--brass); margin-bottom: 20px; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand h1 { font-family: var(--display); font-size: clamp(22px, 4vw, 38px); margin: 0; letter-spacing: .02em; color: var(--bone); text-shadow: 0 3px 0 rgba(0,0,0,.5); line-height: 1; }
  .brand h1 span { color: var(--red-2); }
  .bull-mark { width: 48px; height: 48px; border-radius: 50%; background:
      radial-gradient(circle, var(--red) 0 30%, var(--brass) 30% 36%, var(--green) 36% 62%, var(--brass) 62% 68%, var(--bone) 68% 100%);
    box-shadow: 0 0 0 3px var(--ink), 0 4px 12px rgba(0,0,0,.5); flex: none; }
  .meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .chip { font-family: var(--num); font-weight: 700; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--felt-2); color: var(--bone-2); }
  .chip strong { color: var(--brass-2); font-size: 18px; margin-left: 4px; }
  .btn-ghost { background: transparent; border: 1px solid var(--line); color: var(--bone-2); padding: 8px 14px; border-radius: 8px; font-weight: 600; }
  .btn-ghost:hover { border-color: var(--brass); color: var(--brass-2); }

  /* ---------- buttons ---------- */
  .btn { border: none; border-radius: 10px; padding: 14px 22px; font-family: var(--num); font-weight: 800; font-size: 20px; letter-spacing: .06em; text-transform: uppercase; color: var(--bone); background: var(--green); box-shadow: 0 4px 0 #14502f, var(--shadow); transition: transform .08s, box-shadow .08s; }
  .btn:hover { background: var(--green-2); }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #14502f; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.red { background: var(--red); box-shadow: 0 4px 0 #7f1f1a, var(--shadow); }
  .btn.red:hover { background: var(--red-2); }
  .btn.brass { background: var(--brass); color: var(--ink); box-shadow: 0 4px 0 #7d6229, var(--shadow); }
  .btn.brass:hover { background: var(--brass-2); }

  /* ---------- setup ---------- */
  .setup { display: grid; grid-template-columns: 1.1fr .9fr; gap: 22px; align-items: start; }
  @media (max-width: 760px) { .setup { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; box-shadow: var(--shadow); }
  .card h2 { font-family: var(--num); font-weight: 800; font-size: 15px; letter-spacing: .14em; text-transform: uppercase; color: var(--brass-2); margin: 0 0 14px; }
  .field { display: flex; gap: 10px; }
  .field input { flex: 1; min-width: 0; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--felt); color: var(--bone); font-size: 18px; }
  .field input::placeholder { color: var(--muted); }
  .swatches { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0 6px; }
  .swatch { width: 34px; height: 34px; border-radius: 50%; border: 3px solid transparent; padding: 0; }
  .swatch[aria-pressed="true"] { border-color: var(--bone); box-shadow: 0 0 0 2px var(--ink); }
  .icons { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .icon-btn { font-size: 22px; width: 42px; height: 42px; border-radius: 10px; border: 1px solid var(--line); background: var(--felt); }
  .icon-btn[aria-pressed="true"] { background: var(--bone); border-color: var(--brass); }
  .roster { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 8px; }
  .roster li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--felt); border-radius: 10px; border: 1px solid var(--line); }
  .roster .dot { width: 14px; height: 14px; border-radius: 50%; flex: none; }
  .roster .name { flex: 1; font-weight: 600; font-size: 17px; }
  .roster .remove { background: none; border: none; color: var(--muted); font-size: 18px; padding: 2px 6px; }
  .roster .remove:hover { color: var(--red-2); }
  .empty { color: var(--muted); font-style: italic; margin: 16px 0 0; }

  .targets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .target-opt { border: 2px solid var(--line); background: var(--felt); color: var(--bone); border-radius: 12px; padding: 14px 6px 10px; text-align: center; font-family: var(--num); font-weight: 800; font-size: 34px; line-height: 1; }
  .target-opt small { display: block; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-top: 6px; font-weight: 600; }
  .target-opt[aria-pressed="true"] { border-color: var(--brass); background: var(--bone); color: var(--ink); }
  .target-opt[aria-pressed="true"] small { color: #6b5a2c; }
  .custom { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
  .custom input { width: 110px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--felt); color: var(--bone); font-family: var(--num); font-size: 24px; font-weight: 700; }
  .custom label { color: var(--muted); font-size: 14px; }

  .rules-table { width: 100%; border-collapse: collapse; font-family: var(--num); font-size: 17px; }
  .rules-table th, .rules-table td { padding: 8px 6px; text-align: center; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  .rules-table th { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .rules-table td:first-child { color: var(--brass-2); font-weight: 800; }
  .rules-table .plus { color: var(--green-2); font-weight: 700; }
  .rules-table .minus { color: var(--red-2); font-weight: 700; }
  .rules-note { color: var(--muted); font-size: 14px; margin: 12px 0 0; }
  .start-row { grid-column: 1 / -1; display: flex; justify-content: center; padding-top: 6px; }

  /* ---------- play ---------- */
  .play { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); gap: 22px; align-items: start; }
  @media (max-width: 860px) { .play { grid-template-columns: 1fr; } }

  .turn { background: var(--bone); color: var(--ink); border-radius: 16px; padding: 20px; box-shadow: var(--shadow); border: 4px solid var(--brass); position: relative; overflow: hidden; }
  .turn-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .who { display: flex; align-items: center; gap: 12px; }
  .who .avatar { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-size: 24px; box-shadow: inset 0 0 0 3px rgba(0,0,0,.25); }
  .who .label { font-family: var(--num); font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: #6b5a2c; font-weight: 700; }
  .who .pname { font-family: var(--display); font-size: clamp(18px, 3vw, 26px); line-height: 1.05; }
  .level-pill { font-family: var(--num); font-weight: 800; font-size: 17px; letter-spacing: .08em; text-transform: uppercase; background: var(--ink); color: var(--brass-2); padding: 8px 14px; border-radius: 999px; }

  .stage { display: grid; grid-template-columns: 220px 1fr; gap: 18px; align-items: center; margin-top: 16px; }
  @media (max-width: 520px) { .stage { grid-template-columns: 1fr; justify-items: center; } }
  canvas.board { width: 220px; height: 220px; border-radius: 50%; box-shadow: 0 6px 20px rgba(0,0,0,.35); }
  .target-box { text-align: center; }
  .target-box .label { font-family: var(--num); font-size: 14px; letter-spacing: .18em; text-transform: uppercase; color: #6b5a2c; font-weight: 700; }
  .target-box .target { font-family: var(--display); font-size: clamp(64px, 12vw, 110px); line-height: 1; color: var(--red); text-shadow: 0 4px 0 rgba(0,0,0,.18); }
  .target-box .worth { font-family: var(--num); font-size: 16px; color: #4a3f22; font-weight: 600; }
  .target-box .worth b { color: var(--green); }
  .target-box .worth i { color: var(--red); font-style: normal; }

  .entry { margin-top: 18px; display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: stretch; }
  @media (max-width: 520px) { .entry { grid-template-columns: 1fr; } }
  .scored { background: var(--ink); color: var(--bone); border-radius: 12px; padding: 10px 16px; display: flex; flex-direction: column; justify-content: center; }
  .scored .label { font-family: var(--num); font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .scored .value { font-family: var(--num); font-size: 56px; font-weight: 800; line-height: 1; min-height: 56px; font-variant-numeric: tabular-nums; }
  .scored .value.empty { color: #4d5a50; }
  .pad { display: grid; grid-template-columns: repeat(3, 64px); gap: 8px; }
  .pad button { height: 52px; border-radius: 10px; border: 2px solid #b9ad8f; background: #fbf6e8; color: var(--ink); font-family: var(--num); font-weight: 800; font-size: 26px; }
  .pad button:hover { background: #fff; border-color: var(--brass); }
  .pad button.wide { grid-column: span 2; }
  .pad button.del { font-size: 18px; background: #e9dfc4; }
  .submit-row { margin-top: 14px; display: flex; gap: 10px; flex-wrap: wrap; }
  .submit-row .btn { flex: 1; }

  /* result overlay inside turn card */
  .result { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 20px; background: var(--green); color: var(--bone); animation: pop .25s ease-out; }
  .result.miss { background: var(--red); }
  .result .big { font-family: var(--display); font-size: clamp(40px, 8vw, 72px); line-height: 1; text-shadow: 0 4px 0 rgba(0,0,0,.3); }
  .result .detail { font-family: var(--num); font-size: 22px; font-weight: 600; margin: 10px 0 18px; }
  .result .detail b { font-size: 30px; }
  .result .btn { background: var(--bone); color: var(--ink); box-shadow: 0 4px 0 rgba(0,0,0,.35); }
  @keyframes pop { from { transform: scale(.94); opacity: 0; } to { transform: none; opacity: 1; } }

  /* players */
  .players { display: grid; gap: 10px; }
  .pcard { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; transition: border-color .2s, box-shadow .2s; }
  .pcard.active { border-color: var(--brass); box-shadow: 0 0 0 2px rgba(201,162,75,.35), var(--shadow); }
  .pcard .avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-size: 20px; box-shadow: inset 0 0 0 3px rgba(0,0,0,.3); }
  .pcard .pname { font-weight: 700; font-size: 17px; }
  .pcard .sub { display: flex; align-items: center; gap: 10px; margin-top: 4px; }
  .pips { display: flex; gap: 4px; }
  .pip { width: 16px; height: 8px; border-radius: 3px; background: var(--line); }
  .pip.on { background: var(--brass); }
  .pcard .lvl { font-family: var(--num); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .pcard .tgt { font-family: var(--num); font-size: 13px; color: var(--muted); }
  .pcard .tgt b { color: var(--bone); font-size: 15px; }
  .score { text-align: right; }
  .score .n { font-family: var(--num); font-size: 38px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .score .bar { width: 90px; height: 6px; background: var(--line); border-radius: 3px; margin-top: 6px; overflow: hidden; }
  .score .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--green-2), var(--brass-2)); border-radius: 3px; transition: width .4s; }

  .side h2 { font-family: var(--num); font-weight: 800; font-size: 15px; letter-spacing: .14em; text-transform: uppercase; color: var(--brass-2); margin: 18px 0 10px; }
  .side h2:first-child { margin-top: 0; }
  .history { list-style: none; margin: 0; padding: 0; max-height: 260px; overflow-y: auto; display: grid; gap: 6px; }
  .history li { display: grid; grid-template-columns: 8px 1fr auto; gap: 10px; align-items: center; padding: 8px 12px; background: var(--felt-2); border-radius: 8px; font-size: 15px; }
  .history li::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--green-2); }
  .history li.miss::before { background: var(--red-2); }
  .history .r { font-family: var(--num); font-weight: 700; font-variant-numeric: tabular-nums; }
  .history .r.miss { color: var(--red-2); }
  .history .r.hit { color: var(--green-2); }
  .history .who { color: var(--muted); font-size: 13px; }
  .history .who b { color: var(--bone); font-size: 15px; }

  /* winner */
  .winner { position: fixed; inset: 0; background: rgba(8,15,11,.86); display: grid; place-items: center; padding: 20px; z-index: 20; }
  .winner .inner { background: var(--bone); color: var(--ink); border: 6px solid var(--brass); border-radius: 20px; padding: 34px 30px; text-align: center; max-width: 520px; width: 100%; box-shadow: var(--shadow); animation: pop .3s ease-out; }
  .winner .eyebrow { font-family: var(--num); font-size: 15px; letter-spacing: .2em; text-transform: uppercase; color: #6b5a2c; font-weight: 700; }
  .winner .name { font-family: var(--display); font-size: clamp(34px, 7vw, 56px); line-height: 1.05; color: var(--red); margin: 8px 0; }
  .winner .pts { font-family: var(--num); font-size: 22px; font-weight: 600; margin-bottom: 22px; }
  .winner .actions { display: grid; gap: 10px; }
  .winner .avatar { width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; font-size: 44px; margin: 0 auto 10px; box-shadow: inset 0 0 0 4px rgba(0,0,0,.25); }

  .rules-drawer { margin-top: 22px; }
  .rules-drawer summary { cursor: pointer; font-family: var(--num); font-weight: 800; font-size: 15px; letter-spacing: .14em; text-transform: uppercase; color: var(--brass-2); list-style: none; display: flex; align-items: center; gap: 8px; }
  .rules-drawer summary::before { content: "▸"; transition: transform .2s; }
  .rules-drawer[open] summary::before { transform: rotate(90deg); }
  .rules-drawer .card { margin-top: 10px; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>

<div class="wrap">
  <header class="masthead">
    <div class="brand">
      <div class="bull-mark" aria-hidden="true"></div>
      <h1>Saved by <span>the Bull</span></h1>
    </div>
    <div class="meta" id="meta"></div>
  </header>

  <main id="app"></main>
</div>

<script>
(function () {
  "use strict";

  // ---------- rules ----------
  const LEVELS = [
    { level: 1, min: 2,   max: 40,  even: true, points: 3,  penalty: 0, failTo: 1 },
    { level: 2, min: 41,  max: 60,  points: 4,  penalty: 2, failTo: 1 },
    { level: 3, min: 61,  max: 80,  points: 5,  penalty: 3, failTo: 2 },
    { level: 4, min: 81,  max: 100, points: 7,  penalty: 4, failTo: 3 },
    { level: 5, min: 101, max: 170, points: 10, penalty: 5, failTo: 4 },
  ];
  const TARGET_OPTIONS = [15, 20, 30, 40, 50, 75];
  const COLORS = ["#c8322b", "#2f9a63", "#c9a24b", "#3b7dd8", "#a05cc7", "#e0762e"];
  const ICONS = ["🎯", "🐂", "🍺", "🔥", "👑", "🎲", "🏹", "⚡"];

  function randomTarget(level) {
    const L = LEVELS[level - 1];
    let t;
    do { t = Math.floor(Math.random() * (L.max - L.min + 1)) + L.min; } while (L.even && t % 2 !== 0);
    return t;
  }

  // ---------- state ----------
  const KEY = "saved-by-the-bull:v1";
  let state = load() || freshSetup();

  function freshSetup() {
    return { screen: "setup", targetScore: 50, customTarget: "", draft: { name: "", color: COLORS[0], icon: ICONS[0] }, players: [], current: 0, entry: "", rounds: [], result: null, winner: null, round: 1 };
  }
  function load() {
    try { const raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* storage unavailable; the game still runs */ }
  }
  function set(patch) { Object.assign(state, patch); save(); render(); }

  // ---------- sounds (generated, nothing to host) ----------
  let ctx = null;
  function audio() {
    try { if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)(); if (ctx.state === "suspended") ctx.resume(); return ctx; } catch (e) { return null; }
  }
  function tone(freq, start, len, type, gain) {
    const c = audio(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || "square"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, c.currentTime + start);
    g.gain.exponentialRampToValueAtTime(gain || 0.18, c.currentTime + start + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + start + len);
    o.connect(g).connect(c.destination);
    o.start(c.currentTime + start); o.stop(c.currentTime + start + len + 0.05);
  }
  const sfx = {
    hit()  { tone(660, 0, .12, "square"); tone(880, .12, .12, "square"); tone(1320, .24, .28, "square"); },
    miss() { tone(220, 0, .18, "sawtooth", .14); tone(160, .18, .32, "sawtooth", .14); },
    win()  { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, i * .13, .16, "square", .16)); tone(1319, .8, .6, "square", .18); },
    tap()  { tone(1200, 0, .04, "sine", .06); },
  };

  // ---------- dartboard ----------
  function drawBoard(canvas) {
    const dpr = window.devicePixelRatio || 1, size = 220;
    canvas.width = size * dpr; canvas.height = size * dpr;
    const g = canvas.getContext("2d"); g.scale(dpr, dpr);
    const cx = size / 2, cy = size / 2, R = size / 2 - 2;
    const nums = [20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5];
    const seg = Math.PI * 2 / 20, start = -Math.PI / 2 - seg / 2;
    const ring = (r0, r1, i, color) => {
      g.beginPath(); g.arc(cx, cy, r1, start + i * seg, start + (i + 1) * seg);
      g.arc(cx, cy, r0, start + (i + 1) * seg, start + i * seg, true); g.closePath();
      g.fillStyle = color; g.fill(); g.strokeStyle = "#b8b8b0"; g.lineWidth = .6; g.stroke();
    };
    g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.fillStyle = "#14110c"; g.fill();
    const rNum = R, rDbl1 = R * .80, rDbl0 = R * .74, rTrb1 = R * .50, rTrb0 = R * .44, rBull = R * .085, rBullO = R * .17;
    for (let i = 0; i < 20; i++) {
      const dark = i % 2 === 0;
      ring(rBullO, rTrb0, i, dark ? "#14110c" : "#ede3cb");
      ring(rTrb0, rTrb1, i, dark ? "#c8322b" : "#237d4f");
      ring(rTrb1, rDbl0, i, dark ? "#14110c" : "#ede3cb");
      ring(rDbl0, rDbl1, i, dark ? "#c8322b" : "#237d4f");
    }
    g.beginPath(); g.arc(cx, cy, rBullO, 0, Math.PI * 2); g.fillStyle = "#237d4f"; g.fill();
    g.beginPath(); g.arc(cx, cy, rBull, 0, Math.PI * 2); g.fillStyle = "#c8322b"; g.fill();
    g.fillStyle = "#ede3cb"; g.font = "700 11px 'Barlow Condensed', 'Arial Narrow', sans-serif"; g.textAlign = "center"; g.textBaseline = "middle";
    for (let i = 0; i < 20; i++) {
      const a = -Math.PI / 2 + i * seg, r = (rNum + rDbl1) / 2 + 1;
      g.fillText(String(nums[i]), cx + Math.cos(a) * r, cy + Math.sin(a) * r);
    }
  }

  // ---------- helpers ----------
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const el = (sel, root) => (root || document).querySelector(sel);
  const app = el("#app"), meta = el("#meta");

  function avatar(p, cls) { return `<div class="${cls || "avatar"}" style="background:${p.color}">${p.icon}</div>`; }
  function pips(level) { return `<div class="pips" aria-label="Level ${level} of 5">${[1,2,3,4,5].map(n => `<span class="pip${n <= level ? " on" : ""}"></span>`).join("")}</div>`; }
  function rulesTable() {
    return `<table class="rules-table">
      <thead><tr><th>Level</th><th>Target between</th><th>Hit</th><th>Miss</th><th>Miss drops to</th></tr></thead>
      <tbody>${LEVELS.map(L => `<tr><td>${L.level}</td><td>${L.min}–${L.max}${L.even ? " (even)" : ""}</td><td class="plus">+${L.points}</td><td class="minus">${L.penalty ? "−" + L.penalty : "0"}</td><td>${L.failTo === L.level ? "stays" : "Level " + L.failTo}</td></tr>`).join("")}</tbody>
    </table>`;
  }

  // ---------- render ----------
  function render() {
    if (state.screen === "setup") renderSetup(); else renderPlay();
  }

  function renderSetup() {
    meta.innerHTML = `<span class="chip">First to <strong>${state.targetScore}</strong></span>`;
    const d = state.draft;
    app.innerHTML = `
      <section class="setup">
        <div class="card">
          <h2>Players</h2>
          <div class="field">
            <input id="nameIn" type="text" maxlength="16" placeholder="Player name" value="${esc(d.name)}" autocomplete="off">
            <button class="btn brass" id="addBtn" type="button">Add</button>
          </div>
          <div class="swatches" role="group" aria-label="Colour">
            ${COLORS.map(c => `<button type="button" class="swatch" data-color="${c}" aria-pressed="${c === d.color}" style="background:${c}" aria-label="Colour ${c}"></button>`).join("")}
          </div>
          <div class="icons" role="group" aria-label="Icon">
            ${ICONS.map(i => `<button type="button" class="icon-btn" data-icon="${i}" aria-pressed="${i === d.icon}">${i}</button>`).join("")}
          </div>
          ${state.players.length
            ? `<ul class="roster">${state.players.map((p, i) => `<li><span class="dot" style="background:${p.color}"></span><span>${p.icon}</span><span class="name">${esc(p.name)}</span><button type="button" class="remove" data-remove="${i}" aria-label="Remove ${esc(p.name)}">✕</button></li>`).join("")}</ul>`
            : `<p class="empty">No players yet. Add at least one to start.</p>`}
        </div>

        <div class="card">
          <h2>Play to</h2>
          <div class="targets" role="group" aria-label="Winning score">
            ${TARGET_OPTIONS.map(n => `<button type="button" class="target-opt" data-target="${n}" aria-pressed="${n === state.targetScore && !state.customTarget}">${n}<small>points</small></button>`).join("")}
          </div>
          <div class="custom">
            <label for="customIn">Or your own:</label>
            <input id="customIn" type="number" min="5" max="999" inputmode="numeric" value="${esc(state.customTarget)}" placeholder="e.g. 100">
          </div>
          <p class="rules-note">First player to reach this score wins. Fewer points makes a quick game; 50 is the original.</p>
        </div>

        <div class="card" style="grid-column: 1 / -1">
          <h2>How the levels work</h2>
          ${rulesTable()}
          <p class="rules-note">Each turn you get a random checkout number for your level. Enter what you actually scored with your three darts. Match it exactly to go up a level and bank the points; miss and you lose the penalty and drop back. Scores never go below zero.</p>
        </div>

        <div class="start-row">
          <button class="btn" id="startBtn" type="button" ${state.players.length ? "" : "disabled"}>Start game</button>
        </div>
      </section>`;

    const nameIn = el("#nameIn");
    const addPlayer = () => {
      const name = nameIn.value.trim(); if (!name) { nameIn.focus(); return; }
      state.players.push({ name, color: d.color, icon: d.icon, score: 0, level: 1, target: randomTarget(1), hits: 0, misses: 0 });
      const nextColor = COLORS[state.players.length % COLORS.length], nextIcon = ICONS[state.players.length % ICONS.length];
      set({ draft: { name: "", color: nextColor, icon: nextIcon } });
      el("#nameIn").focus();
    };
    el("#addBtn").addEventListener("click", addPlayer);
    nameIn.addEventListener("keydown", e => { if (e.key === "Enter") addPlayer(); });
    nameIn.addEventListener("input", () => { d.name = nameIn.value; save(); });
    app.querySelectorAll(".swatch").forEach(b => b.addEventListener("click", () => { d.name = nameIn.value; set({ draft: { ...d, color: b.dataset.color } }); }));
    app.querySelectorAll(".icon-btn").forEach(b => b.addEventListener("click", () => { d.name = nameIn.value; set({ draft: { ...d, icon: b.dataset.icon } }); }));
    app.querySelectorAll("[data-remove]").forEach(b => b.addEventListener("click", () => { state.players.splice(+b.dataset.remove, 1); set({}); }));
    app.querySelectorAll(".target-opt").forEach(b => b.addEventListener("click", () => set({ targetScore: +b.dataset.target, customTarget: "" })));
    const customIn = el("#customIn");
    customIn.addEventListener("input", () => {
      const v = parseInt(customIn.value, 10);
      if (v >= 5) { state.targetScore = v; state.customTarget = customIn.value; save(); meta.innerHTML = `<span class="chip">First to <strong>${v}</strong></span>`; app.querySelectorAll(".target-opt").forEach(b => b.setAttribute("aria-pressed", "false")); }
    });
    el("#startBtn").addEventListener("click", () => {
      audio();
      set({ screen: "play", current: 0, entry: "", rounds: [], result: null, winner: null, round: 1 });
    });
  }

  function renderPlay() {
    const p = state.players[state.current];
    const L = LEVELS[p.level - 1];
    meta.innerHTML = `<span class="chip">First to <strong>${state.targetScore}</strong></span><span class="chip">Round <strong>${state.round}</strong></span><button class="btn-ghost" id="quitBtn" type="button">End game</button>`;

    app.innerHTML = `
      <section class="play">
        <div>
          <div class="turn">
            <div class="turn-head">
              <div class="who">
                ${avatar(p)}
                <div><div class="label">On the oche</div><div class="pname">${esc(p.name)}</div></div>
              </div>
              <div class="level-pill">Level ${p.level}</div>
            </div>
            <div class="stage">
              <canvas class="board" id="board" width="220" height="220" aria-hidden="true"></canvas>
              <div class="target-box">
                <div class="label">Checkout to hit</div>
                <div class="target">${p.target}</div>
                <div class="worth">Hit <b>+${L.points}</b> · Miss <i>${L.penalty ? "−" + L.penalty : "0"}</i>${L.failTo < L.level ? `, back to level ${L.failTo}` : ""}</div>
              </div>
            </div>
            <div class="entry">
              <div class="scored">
                <div class="label">You scored</div>
                <div class="value ${state.entry ? "" : "empty"}" id="entryVal">${state.entry || "–"}</div>
              </div>
              <div class="pad" aria-label="Number pad">
                ${[1,2,3,4,5,6,7,8,9].map(n => `<button type="button" data-key="${n}">${n}</button>`).join("")}
                <button type="button" data-key="0" class="wide">0</button>
                <button type="button" data-key="del" class="del" aria-label="Delete">⌫</button>
              </div>
            </div>
            <div class="submit-row">
              <button class="btn" id="hitBtn" type="button" ${state.entry === "" ? "disabled" : ""}>Enter score</button>
              <button class="btn red" id="missBtn" type="button">Missed it</button>
            </div>
            ${state.result ? renderResult(state.result) : ""}
          </div>

          <details class="rules-drawer">
            <summary>Level table</summary>
            <div class="card">${rulesTable()}</div>
          </details>
        </div>

        <aside class="side">
          <h2>Scoreboard</h2>
          <div class="players">
            ${[...state.players].map((q, i) => ({ q, i })).sort((a, b) => b.q.score - a.q.score).map(({ q, i }) => `
              <div class="pcard${i === state.current ? " active" : ""}">
                ${avatar(q)}
                <div>
                  <div class="pname">${esc(q.name)}</div>
                  <div class="sub">${pips(q.level)}<span class="lvl">Lvl ${q.level}</span><span class="tgt">next <b>${q.target}</b></span></div>
                </div>
                <div class="score"><div class="n">${q.score}</div><div class="bar"><i style="width:${Math.min(100, q.score / state.targetScore * 100)}%"></i></div></div>
              </div>`).join("")}
          </div>
          <h2>This game</h2>
          ${state.rounds.length
            ? `<ul class="history">${[...state.rounds].reverse().map(r => `<li class="${r.hit ? "hit" : "miss"}"><span class="who"><b>${esc(r.player)}</b> · needed ${r.target}, scored ${r.scored}</span><span class="r ${r.hit ? "hit" : "miss"}">${r.hit ? "+" + r.delta : (r.delta ? "−" + r.delta : "0")} → L${r.level}</span></li>`).join("")}</ul>`
            : `<p class="empty">No throws yet. ${esc(p.name)} is up first.</p>`}
        </aside>
      </section>
      ${state.winner != null ? renderWinner() : ""}`;

    drawBoard(el("#board"));

    app.querySelectorAll("[data-key]").forEach(b => b.addEventListener("click", () => {
      sfx.tap();
      const k = b.dataset.key;
      let e = state.entry;
      if (k === "del") e = e.slice(0, -1);
      else if (e.length < 3) e = (e === "0" ? "" : e) + k;
      set({ entry: e });
    }));
    el("#hitBtn").addEventListener("click", () => submit(parseInt(state.entry, 10)));
    el("#missBtn").addEventListener("click", () => submit(null));
    el("#quitBtn").addEventListener("click", () => { if (confirm("End this game and go back to setup? Scores will be lost.")) resetToSetup(); });
    const nextBtn = el("#nextBtn"); if (nextBtn) nextBtn.addEventListener("click", nextTurn);
    const againBtn = el("#againBtn"); if (againBtn) againBtn.addEventListener("click", playAgain);
    const changeBtn = el("#changeBtn"); if (changeBtn) changeBtn.addEventListener("click", resetToSetup);
  }

  function renderResult(r) {
    return `<div class="result ${r.hit ? "hit" : "miss"}" role="status">
      <div>
        <div class="big">${r.hit ? "HIT!" : "MISSED"}</div>
        <div class="detail">${r.hit
          ? `<b>+${r.delta}</b> points${r.levelUp ? ` · up to level ${r.level}` : " · top level held"}`
          : `${r.delta ? `<b>−${r.delta}</b> points` : "no points lost"}${r.levelDown ? ` · back to level ${r.level}` : ""}`}</div>
        <div class="detail" style="font-size:18px;margin-top:-8px">${esc(r.player)} now has ${r.score}</div>
        <button class="btn" id="nextBtn" type="button">Next player</button>
      </div>
    </div>`;
  }

  function renderWinner() {
    const w = state.players[state.winner];
    return `<div class="winner" role="dialog" aria-label="Winner">
      <div class="inner">
        ${avatar(w)}
        <div class="eyebrow">Saved by the Bull</div>
        <div class="name">${esc(w.name)} wins!</div>
        <div class="pts">${w.score} points · first to ${state.targetScore}</div>
        <div class="actions">
          <button class="btn" id="againBtn" type="button">Play again, same players</button>
          <button class="btn brass" id="changeBtn" type="button">Change players</button>
        </div>
      </div>
    </div>`;
  }

  // ---------- game flow ----------
  function submit(scored) {
    if (state.result) return;
    const p = state.players[state.current];
    const L = LEVELS[p.level - 1];
    const hit = scored === p.target;
    const before = p.level;
    let delta;
    if (hit) {
      delta = L.points; p.score += delta; p.hits++;
      if (p.level < 5) p.level++;
      sfx.hit();
    } else {
      delta = L.penalty; p.score = Math.max(0, p.score - delta); p.misses++;
      p.level = L.failTo;
      sfx.miss();
    }
    const usedTarget = p.target;
    p.target = randomTarget(p.level);
    const result = { player: p.name, hit, delta, level: p.level, levelUp: p.level > before, levelDown: p.level < before, score: p.score, target: usedTarget, scored: scored == null ? "miss" : scored };
    state.rounds.push(result);
    if (p.score >= state.targetScore) { state.winner = state.current; state.result = null; set({ entry: "" }); setTimeout(sfx.win, 150); return; }
    set({ result, entry: "" });
  }
  function nextTurn() {
    let next = (state.current + 1) % state.players.length;
    set({ current: next, result: null, entry: "", round: next === 0 ? state.round + 1 : state.round });
  }
  function playAgain() {
    state.players.forEach(p => { p.score = 0; p.level = 1; p.target = randomTarget(1); p.hits = 0; p.misses = 0; });
    set({ current: 0, entry: "", rounds: [], result: null, winner: null, round: 1 });
  }
  function resetToSetup() {
    state.players.forEach(p => { p.score = 0; p.level = 1; p.target = randomTarget(1); p.hits = 0; p.misses = 0; });
    set({ screen: "setup", current: 0, entry: "", rounds: [], result: null, winner: null, round: 1 });
  }

  // keyboard entry during play
  document.addEventListener("keydown", e => {
    if (state.screen !== "play" || state.winner != null) return;
    if (e.target && (e.target.tagName === "INPUT")) return;
    if (state.result) { if (e.key === "Enter") { e.preventDefault(); nextTurn(); } return; }
    if (/^[0-9]$/.test(e.key)) { e.preventDefault(); let s = state.entry; if (s.length < 3) set({ entry: (s === "0" ? "" : s) + e.key }); }
    else if (e.key === "Backspace") { e.preventDefault(); set({ entry: state.entry.slice(0, -1) }); }
    else if (e.key === "Enter" && state.entry !== "") { e.preventDefault(); submit(parseInt(state.entry, 10)); }
  });

  render();
})();
</script>
