<title>Saved by the Bull</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700;800&display=swap">
<style>
  :root {
    --felt: #0f3d2a;
    --felt-2: #144d35;
    --panel: #1a5a3f;
    --line: #2c7a56;
    --bone: #fff4d6;
    --bone-2: #f3e5bb;
    --ink: #14110c;
    --red: #e8362c;
    --red-2: #ff5c4f;
    --green: #21a55e;
    --green-2: #35c877;
    --brass: #f2b83b;
    --brass-2: #ffd45c;
    --muted: #b7d3c0;
    --shadow: 0 10px 30px rgba(0,0,0,.45);
    --display: "Bungee", "Impact", "Arial Black", sans-serif;
    --body: "Barlow", "Helvetica Neue", Arial, sans-serif;
    --num: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body {
    margin: 0;
    background: var(--felt);
    background-image:
      radial-gradient(ellipse at 50% -10%, rgba(255,212,92,.28), transparent 55%),
      radial-gradient(ellipse at 100% 100%, rgba(232,54,44,.18), transparent 50%),
      repeating-linear-gradient(45deg, rgba(255,255,255,.02) 0 2px, transparent 2px 6px);
    color: var(--bone);
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.45;
    min-height: 100vh;
  }
  button { font: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--brass-2); outline-offset: 2px; }
  [hidden] { display: none !important; }

  .wrap { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }

  /* ---------- header ---------- */
  .masthead { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 6px 0 18px; border-bottom: 2px solid var(--brass); margin-bottom: 20px; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand h1 { font-family: var(--display); font-size: clamp(22px, 4vw, 38px); margin: 0; letter-spacing: .02em; color: var(--bone); text-shadow: 0 3px 0 rgba(0,0,0,.5); line-height: 1; }
  .brand h1 span { color: var(--red-2); }
  .bull-mark { width: 48px; height: 48px; border-radius: 50%; background:
      radial-gradient(circle, var(--red) 0 30%, var(--brass) 30% 36%, var(--green) 36% 62%, var(--brass) 62% 68%, var(--bone) 68% 100%);
    box-shadow: 0 0 0 3px var(--ink), 0 4px 12px rgba(0,0,0,.5); flex: none; }
  .meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .chip { font-family: var(--num); font-weight: 700; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--felt-2); color: var(--bone-2); }
  .chip strong { color: var(--brass-2); font-size: 18px; margin-left: 4px; }
  .btn-ghost { background: transparent; border: 1px solid var(--line); color: var(--bone-2); padding: 8px 14px; border-radius: 8px; font-weight: 600; }
  .btn-ghost:hover { border-color: var(--brass); color: var(--brass-2); }
  .btn-ghost[aria-pressed="true"] { border-color: var(--brass); color: var(--brass-2); background: rgba(201,162,75,.12); }

  /* ---------- buttons ---------- */
  .btn { border: none; border-radius: 10px; padding: 14px 22px; font-family: var(--num); font-weight: 800; font-size: 20px; letter-spacing: .06em; text-transform: uppercase; color: var(--bone); background: var(--green); box-shadow: 0 4px 0 #14502f, var(--shadow); transition: transform .08s, box-shadow .08s; }
  .btn:hover { background: var(--green-2); }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #14502f; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.red { background: var(--red); box-shadow: 0 4px 0 #7f1f1a, var(--shadow); }
  .btn.red:hover { background: var(--red-2); }
  .btn.brass { background: var(--brass); color: var(--ink); box-shadow: 0 4px 0 #7d6229, var(--shadow); }
  .btn.brass:hover { background: var(--brass-2); }
  .btn.quiet { background: #d9cdae; color: var(--ink); box-shadow: 0 4px 0 #a8996f, var(--shadow); }
  .btn.quiet:hover { background: #e6dcc2; }

  /* ---------- setup ---------- */
  .setup { display: grid; grid-template-columns: 1.1fr .9fr; gap: 22px; align-items: start; }
  @media (max-width: 760px) { .setup { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; box-shadow: var(--shadow); }
  .card h2 { font-family: var(--num); font-weight: 800; font-size: 15px; letter-spacing: .14em; text-transform: uppercase; color: var(--brass-2); margin: 0 0 14px; }
  .span2 { grid-column: 1 / -1; }
  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 520px) { .modes { grid-template-columns: 1fr; } }
  .mode { border: 2px solid var(--line); background: var(--felt); color: var(--bone); border-radius: 14px; padding: 16px 18px; text-align: left; display: grid; gap: 4px; }
  .mode .t { font-family: var(--display); font-size: 20px; line-height: 1.1; }
  .mode .d { color: var(--muted); font-size: 14px; }
  .mode[aria-pressed="true"] { border-color: var(--brass); background: var(--bone); color: var(--ink); }
  .mode[aria-pressed="true"] .d { color: #6b5a2c; }
  .field { display: flex; gap: 10px; }
  .field input { flex: 1; min-width: 0; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--felt); color: var(--bone); font-size: 18px; }
  .field input::placeholder { color: var(--muted); }
  .swatches { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0 6px; }
  .swatch { width: 34px; height: 34px; border-radius: 50%; border: 3px solid transparent; padding: 0; }
  .swatch[aria-pressed="true"] { border-color: var(--bone); box-shadow: 0 0 0 2px var(--ink); }
  .icons { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .icon-btn { font-size: 22px; width: 42px; height: 42px; border-radius: 10px; border: 1px solid var(--line); background: var(--felt); }
  .icon-btn[aria-pressed="true"] { background: var(--bone); border-color: var(--brass); }
  .roster { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 8px; }
  .roster li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--felt); border-radius: 10px; border: 1px solid var(--line); }
  .roster .dot { width: 14px; height: 14px; border-radius: 50%; flex: none; }
  .roster .name { flex: 1; font-weight: 600; font-size: 17px; }
  .remove { background: none; border: none; color: var(--muted); font-size: 18px; padding: 2px 6px; }
  .remove:hover { color: var(--red-2); }
  .empty { color: var(--muted); font-style: italic; margin: 16px 0 0; }

  .opts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .opt { border: 2px solid var(--line); background: var(--felt); color: var(--bone); border-radius: 12px; padding: 14px 6px 10px; text-align: center; font-family: var(--num); font-weight: 800; font-size: 34px; line-height: 1; }
  .opt small { display: block; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-top: 6px; font-weight: 600; }
  .opt[aria-pressed="true"] { border-color: var(--brass); background: var(--bone); color: var(--ink); }
  .opt[aria-pressed="true"] small { color: #6b5a2c; }
  .opts.small .opt { font-size: 24px; padding: 10px 6px 8px; }
  .custom { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
  .custom input { width: 110px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--felt); color: var(--bone); font-family: var(--num); font-size: 24px; font-weight: 700; }
  .custom label { color: var(--muted); font-size: 14px; }
  .sub-h { font-family: var(--num); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin: 16px 0 8px; }
  .sub-h:first-of-type { margin-top: 0; }

  .rules-table { width: 100%; border-collapse: collapse; font-family: var(--num); font-size: 17px; }
  .rules-table th, .rules-table td { padding: 8px 6px; text-align: center; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  .rules-table th { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .rules-table td:first-child { color: var(--brass-2); font-weight: 800; }
  .rules-table .plus { color: var(--green-2); font-weight: 700; }
  .rules-table .minus { color: var(--red-2); font-weight: 700; }
  .rules-note { color: var(--muted); font-size: 14px; margin: 12px 0 0; }
  .start-row { grid-column: 1 / -1; display: flex; justify-content: center; padding-top: 6px; }

  /* ---------- play ---------- */
  .play { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); gap: 22px; align-items: start; }
  @media (max-width: 860px) { .play { grid-template-columns: 1fr; } }

  .turn { background: var(--bone); color: var(--ink); border-radius: 16px; padding: 20px; box-shadow: var(--shadow); border: 4px solid var(--brass); position: relative; overflow: hidden; }
  .turn-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .who { display: flex; align-items: center; gap: 12px; }
  .who .avatar { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-size: 24px; box-shadow: inset 0 0 0 3px rgba(0,0,0,.25); }
  .who .label { font-family: var(--num); font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: #6b5a2c; font-weight: 700; }
  .who .pname { font-family: var(--display); font-size: clamp(18px, 3vw, 26px); line-height: 1.05; }
  .level-pill { font-family: var(--num); font-weight: 800; font-size: 17px; letter-spacing: .08em; text-transform: uppercase; background: var(--ink); color: var(--brass-2); padding: 8px 14px; border-radius: 999px; }

  .stage { display: grid; grid-template-columns: 220px 1fr; gap: 18px; align-items: center; margin-top: 16px; }
  @media (max-width: 520px) { .stage { grid-template-columns: 1fr; justify-items: center; } }
  canvas.board { width: 220px; height: 220px; border-radius: 50%; box-shadow: 0 6px 20px rgba(0,0,0,.35); }
  .target-box { text-align: center; }
  .target-box .label { font-family: var(--num); font-size: 14px; letter-spacing: .18em; text-transform: uppercase; color: #6b5a2c; font-weight: 700; }
  .target-box .target { font-family: var(--display); font-size: clamp(64px, 12vw, 110px); line-height: 1; color: var(--red); text-shadow: 0 4px 0 rgba(0,0,0,.18); }
  .target-box .worth { font-family: var(--num); font-size: 16px; color: #4a3f22; font-weight: 600; }
  .target-box .worth b { color: var(--green); }
  .target-box .worth i { color: var(--red); font-style: normal; }

  .submit-row { margin-top: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 420px) { .submit-row { grid-template-columns: 1fr; } }
  .submit-row.three { grid-template-columns: 1fr 1fr 1fr; }
  @media (max-width: 640px) { .submit-row.three { grid-template-columns: 1fr; } }
  .submit-row .btn { padding: 22px 12px; font-size: 26px; }
  .submit-row .btn.brass { font-size: 20px; line-height: 1.1; }
  .submit-row .btn small { display: block; font-size: 13px; letter-spacing: .12em; opacity: .85; margin-top: 4px; }
  .hint { text-align: center; color: #6b5a2c; font-size: 14px; margin: 12px 0 0; }

  /* 501 */
  .req { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center; margin-top: 14px; }
  @media (max-width: 520px) { .req { grid-template-columns: 1fr; } }
  .req .label { font-family: var(--num); font-size: 14px; letter-spacing: .18em; text-transform: uppercase; color: #6b5a2c; font-weight: 700; }
  .req .n { font-family: var(--display); font-size: clamp(64px, 12vw, 104px); line-height: 1; color: var(--ink); font-variant-numeric: tabular-nums; }
  .req .n.finish { color: var(--red); }
  .suggest { background: var(--ink); color: var(--bone); border-radius: 12px; padding: 12px 16px; min-width: 220px; }
  .suggest .label { color: var(--brass-2); font-family: var(--num); font-size: 12px; letter-spacing: .16em; text-transform: uppercase; font-weight: 700; }
  .suggest .route { font-family: var(--num); font-size: 28px; font-weight: 800; line-height: 1.15; margin-top: 4px; }
  .suggest .route.small { font-size: 20px; }
  .suggest .why { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .suggest.finish { background: var(--green); }
  .suggest.finish .label { color: var(--bone); opacity: .85; }
  .suggest.finish .why { color: rgba(237,227,203,.85); }

  .entry { margin-top: 16px; display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: stretch; }
  @media (max-width: 560px) { .entry { grid-template-columns: 1fr; } }
  .scored { background: var(--ink); color: var(--bone); border-radius: 12px; padding: 10px 16px; display: flex; flex-direction: column; justify-content: center; gap: 8px; }
  .scored .label { font-family: var(--num); font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .scored .value { font-family: var(--num); font-size: 60px; font-weight: 800; line-height: 1; min-height: 60px; font-variant-numeric: tabular-nums; }
  .scored .value.empty { color: #4d5a50; }
  .scored .msg { font-size: 14px; color: var(--red-2); min-height: 20px; font-weight: 600; }
  .quick { display: flex; flex-wrap: wrap; gap: 6px; }
  .quick button { border: 1px solid #3a5544; background: var(--felt-2); color: var(--bone-2); border-radius: 8px; padding: 6px 10px; font-family: var(--num); font-weight: 700; font-size: 16px; }
  .quick button:hover { border-color: var(--brass); color: var(--brass-2); }
  .pad { display: grid; grid-template-columns: repeat(3, 64px); gap: 8px; }
  .pad button { height: 52px; border-radius: 10px; border: 2px solid #b9ad8f; background: #fbf6e8; color: var(--ink); font-family: var(--num); font-weight: 800; font-size: 26px; }
  .pad button:hover { background: #fff; border-color: var(--brass); }
  .pad button.del { font-size: 18px; background: #e9dfc4; }
  .pad button.mic { font-size: 20px; background: #e9dfc4; }
  .pad button.mic[aria-pressed="true"] { background: var(--red); color: var(--bone); border-color: var(--red); }
  .x01-row { margin-top: 14px; display: grid; grid-template-columns: 2fr 1fr; gap: 10px; }
  .x01-row .btn { padding: 18px 16px; font-size: 24px; }

  /* result overlay inside turn card */
  .result { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 20px; background: var(--green); color: var(--bone); animation: pop .25s ease-out; z-index: 2; }
  .result.miss { background: var(--red); }
  .result.neutral { background: var(--ink); }
  .result.saved { background: var(--brass); color: var(--ink); }
  .result.saved .big { text-shadow: 0 4px 0 rgba(0,0,0,.15); }
  .result.saved .btn { background: var(--ink); color: var(--bone); }
  .result .big { font-family: var(--display); font-size: clamp(40px, 8vw, 72px); line-height: 1; text-shadow: 0 4px 0 rgba(0,0,0,.3); }
  .result .detail { font-family: var(--num); font-size: 22px; font-weight: 600; margin: 10px 0 18px; }
  .result .detail b { font-size: 30px; }
  .result .btn { background: var(--bone); color: var(--ink); box-shadow: 0 4px 0 rgba(0,0,0,.35); }
  .result .darts { display: flex; gap: 10px; justify-content: center; margin: 6px 0 16px; }
  .result .darts button { width: 64px; height: 64px; border-radius: 12px; border: 3px solid rgba(255,255,255,.5); background: transparent; color: var(--bone); font-family: var(--num); font-size: 30px; font-weight: 800; }
  .result .darts button:hover { background: rgba(255,255,255,.15); }
  @keyframes pop { from { transform: scale(.94); opacity: 0; } to { transform: none; opacity: 1; } }
  .result.mega { background: radial-gradient(circle at 50% 40%, #ffe27a, var(--brass) 55%, #d9901e); color: var(--ink); }
  .result.mega .big { font-size: clamp(56px, 12vw, 120px); text-shadow: 0 6px 0 rgba(0,0,0,.2); animation: thump .5s ease-out 3; }
  .result.mega .detail { color: #3a2a06; }
  .result.mega .btn { background: var(--ink); color: var(--bone); }
  @keyframes thump { 0% { transform: scale(.6); } 50% { transform: scale(1.12); } 100% { transform: scale(1); } }
  .result .undo { display: block; margin: 12px auto 0; background: none; border: none; color: inherit; opacity: .8; font-family: var(--num); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 13px; text-decoration: underline; }
  .confetti { position: fixed; inset: 0; pointer-events: none; z-index: 40; overflow: hidden; }
  .confetti i { position: absolute; top: -12px; width: 10px; height: 16px; border-radius: 2px; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); opacity: .9; } }
  .flash { animation: flash .35s ease-out 2; }
  .live::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--red); margin-right: 8px; vertical-align: middle; animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.7); } }
  @keyframes flash { 0%, 100% { filter: none; } 50% { filter: brightness(1.6); } }

  /* players */
  .players { display: grid; gap: 10px; }
  .pcard { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; transition: border-color .2s, box-shadow .2s; }
  .pcard.active { border-color: var(--brass); box-shadow: 0 0 0 2px rgba(201,162,75,.35), var(--shadow); }
  .pcard .avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-size: 20px; box-shadow: inset 0 0 0 3px rgba(0,0,0,.3); }
  .pcard .pname { font-weight: 700; font-size: 17px; }
  .pcard .sub { display: flex; align-items: center; gap: 10px; margin-top: 4px; flex-wrap: wrap; }
  .pips { display: flex; gap: 4px; }
  .pip { width: 16px; height: 8px; border-radius: 3px; background: var(--line); }
  .pip.on { background: var(--brass); }
  .pcard .lvl { font-family: var(--num); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .pcard .tgt { font-family: var(--num); font-size: 13px; color: var(--muted); }
  .pcard .tgt b { color: var(--bone); font-size: 15px; }
  .legs { display: flex; gap: 4px; }
  .leg { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--brass); }
  .leg.on { background: var(--brass); }
  .score { text-align: right; }
  .score .n { font-family: var(--num); font-size: 38px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .score .bar { width: 90px; height: 6px; background: var(--line); border-radius: 3px; margin-top: 6px; overflow: hidden; }
  .score .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--green-2), var(--brass-2)); border-radius: 3px; transition: width .4s; }
  .pcard .leave { grid-column: 1 / -1; justify-self: end; background: none; border: none; color: var(--muted); font-family: var(--num); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; padding: 2px 0 0; }
  .pcard .leave:hover { color: var(--red-2); }

  .side h2 { font-family: var(--num); font-weight: 800; font-size: 15px; letter-spacing: .14em; text-transform: uppercase; color: var(--brass-2); margin: 18px 0 10px; }
  .side h2:first-child { margin-top: 0; }
  .history { list-style: none; margin: 0; padding: 0; max-height: 260px; overflow-y: auto; display: grid; gap: 6px; }
  .history li { display: grid; grid-template-columns: 8px 1fr auto; gap: 10px; align-items: center; padding: 8px 12px; background: var(--felt-2); border-radius: 8px; font-size: 15px; }
  .history li::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--green-2); }
  .history li.miss::before { background: var(--red-2); }
  .history li.neutral::before { background: var(--muted); }
  .history .r { font-family: var(--num); font-weight: 700; font-variant-numeric: tabular-nums; }
  .history .r.miss { color: var(--red-2); }
  .history .r.hit { color: var(--green-2); }
  .history .who { color: var(--muted); font-size: 13px; }
  .history .who b { color: var(--bone); font-size: 15px; }

  /* winner + dialogs */
  .winner, .dialog { position: fixed; inset: 0; background: rgba(8,15,11,.86); display: grid; place-items: center; padding: 20px; z-index: 20; }
  .dialog { z-index: 30; background: rgba(8,15,11,.8); }
  .winner .inner, .dialog .inner { background: var(--bone); color: var(--ink); border: 6px solid var(--brass); border-radius: 20px; padding: 34px 30px; text-align: center; max-width: 520px; width: 100%; box-shadow: var(--shadow); animation: pop .3s ease-out; }
  .dialog .inner { border-width: 4px; border-radius: 16px; padding: 26px; max-width: 440px; text-align: left; }
  .dialog h3 { font-family: var(--display); font-size: 24px; margin: 0 0 8px; line-height: 1.1; }
  .dialog p { margin: 0 0 20px; color: #4a3f22; }
  .dialog .actions, .winner .actions { display: grid; gap: 10px; }
  .winner .eyebrow { font-family: var(--num); font-size: 15px; letter-spacing: .2em; text-transform: uppercase; color: #6b5a2c; font-weight: 700; }

  }

  const NEIGHBOURS = { 20: [1, 5], 19: [7, 3], 18: [1, 4], 17: [3, 2], 16: [7, 8], 15: [10, 2], 14: [9, 11], 13: [4, 6], 12: [9, 5], 11: [14, 8], 10: [15, 6], 9: [12, 14], 8: [16, 11], 7: [19, 16], 6: [10, 13], 5: [20, 12], 4: [18, 13], 3: [19, 17], 2: [15, 17], 1: [20, 18] };

  }
  function botDartsLine() {

  }

  // ---------- state ----------

  const SAVED_KEY = "saved-by-the-bull:saved";

  function freshSetup() {

  }

  }

  }

  // ---------- saved games ----------
  function saveGame() {

  function whenText(iso) {

  }

  // ---------- sounds (generated, nothing to host) ----------

  function audio() {
    try { if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)(); if (ctx.state === "suspended") ctx.resume(); return ctx; } catch (e) { return null; }

  };
  // Optional recorded clips (drop MP3s into a sounds/ folder next to index.html on the website).
  // If a clip exists it plays instead of the synthetic voice for that moment; otherwise the caller speaks.
  const CLIPS = { "180": "sounds/180.mp3", gameshot: "sounds/gameshot.mp3", bust: "sounds/bust.mp3", gameon: "sounds/gameon.mp3", ton: "sounds/ton.mp3", saved: "sounds/saved.mp3", bigfish: "sounds/bigfish.mp3" };
  const clipKnown = {};

          <p class="rules-note">${voices().length ? `${voices().length} voices on this device. The caller reads out scores, "you require", checkouts and game shot.` : "This browser hasn't offered any voices yet. Press Test voice; some browsers only list voices after the first tap."}</p>

        </div>

        ${savedGames.length ? `<div class="card span2">
          <h2>Saved games</h2>
          <ul class="saved">${savedGames.map(g => `<li>
            <div><div class="title">${esc(g.title)}</div><div class="when">${g.mode === "x01" ? `${g.start}, leg ${g.leg}` : `Saved by the Bull, round ${g.round}, first to ${g.targetScore}`} · saved ${whenText(g.when)}</div></div>
            <button type="button" class="btn brass" data-resume="${g.id}">Resume</button>
            <button type="button" class="remove" data-delete="${g.id}" aria-label="Delete saved game">✕</button>
          </li>`).join("")}</ul>
        </div>` : ""}

        <div class="card span2">
          ${bull ? `<h2>How the levels work</h2>${rulesTable()}
          <p class="rules-note">Each turn you get a random checkout number for your level. Throw your three darts, then press Hit if you checked it out or Missed if you didn't. A hit goes up a level and banks the points; a miss loses the penalty and drops back. Scores never go below zero.</p>
          <p class="rules-note"><strong style="color:var(--brass-2)">Saved by the Bull:</strong> if the checkout becomes impossible with the darts you have left (say you need 45, hit 19 then 5, and 21 can't be taken with one dart), throw the last dart at the bull. Hit it and nothing changes: no points lost, no level lost, you stay where you are and get a new checkout next turn.</p>`
          : `<h2>Checkout chart</h2>${checkoutChart()}
          <p class="rules-note">T is treble, D is double. The game shows the suggested route whenever a finish is on, and when it isn't, what to score to leave a good one.</p>`}
        </div>

        <div class="start-row">
          <button class="btn" id="startBtn" type="button" ${state.players.length ? "" : "disabled"}>Start game</button>
        </div>
      </section>`;

    const nameIn = el("#nameIn");
    const addPlayer = () => {
      const name = nameIn.value.trim(); if (!name) { nameIn.focus(); return; }
      state.players.push({ name, color: d.color, icon: d.icon, score: 0, level: 1, target: randomTarget(1), remaining: state.x01.start, legs: 0, dartsThrown: 0, pointsScored: 0, last: null });

      set({ draft: { name: "", color: nextColor, icon: nextIcon } });
      el("#nameIn").focus();
    };

    nameIn.addEventListener("keydown", e => { if (e.key === "Enter") addPlayer(); });

    app.querySelectorAll(".mode").forEach(b => b.addEventListener("click", () => { d.name = nameIn.value; set({ mode: b.dataset.mode }); }));
    app.querySelectorAll(".swatch").forEach(b => b.addEventListener("click", () => { d.name = nameIn.value; set({ draft: { ...d, color: b.dataset.color } }); }));
    app.querySelectorAll(".icon-btn").forEach(b => b.addEventListener("click", () => { d.name = nameIn.value; set({ draft: { ...d, icon: b.dataset.icon } }); }));
    app.querySelectorAll("[data-remove]").forEach(b => b.addEventListener("click", () => { state.players.splice(+b.dataset.remove, 1); set({}); }));
    app.querySelectorAll("[data-target]").forEach(b => b.addEventListener("click", () => set({ targetScore: +b.dataset.target, customTarget: "" })));
    app.querySelectorAll("[data-bullkeep]").forEach(b => b.addEventListener("click", () => set({ bullKeep: b.dataset.bullkeep === "1" })));
    const bl = el("#botLvl");
    bl.addEventListener("input", () => { state.botLevel = +bl.value; save(); el("#botLvlText").textContent = `Level ${state.botLevel} · ${botTitle(state.botLevel)} · averages about ${botAverage(state.botLevel)}`; });
    el("#addBot").addEventListener("click", () => {
      d.name = nameIn.value;
      state.players = state.players.filter(p => !p.bot);
      state.players.push({ name: "Bully", bot: true, botLevel: state.botLevel, color: "#8fa3b8", icon: "🐂", score: 0, level: 1, target: randomTarget(1), remaining: state.x01.start, legs: 0, dartsThrown: 0, pointsScored: 0, last: null });
      set({});
    });
    const vb2 = el("#voiceBtn2"); if (vb2) vb2.addEventListener("click", () => { set({ voice: !state.voice }); if (state.voice) speak("Caller on."); else if (canSpeak) speechSynthesis.cancel(); });
    const vsel = el("#voiceSel"); if (vsel) vsel.addEventListener("change", () => { state.voiceName = vsel.value; save(); speak("Game on. One hundred and eighty!"); });
    const tv = el("#testVoice"); if (tv) tv.addEventListener("click", () => {
      unlockSpeech();
      if (!state.voice) state.voice = true;
      speak("Game on. Dave, you require one hundred and seventy. Treble twenty, treble twenty, bull.");
      if (!voices().length) setTimeout(() => { if (state.screen === "setup") render(); }, 600);
    });
    app.querySelectorAll("[data-start]").forEach(b => b.addEventListener("click", () => set({ x01: { ...state.x01, start: +b.dataset.start } })));
    app.querySelectorAll("[data-legs]").forEach(b => b.addEventListener("click", () => set({ x01: { ...state.x01, legs: +b.dataset.legs } })));
    const customIn = el("#customIn");
    if (customIn) customIn.addEventListener("input", () => {
      const v = parseInt(customIn.value, 10);
      if (v >= 5) { state.targetScore = v; state.customTarget = customIn.value; save(); meta.querySelector(".chip strong").textContent = v; app.querySelectorAll("[data-target]").forEach(b => b.setAttribute("aria-pressed", "false")); }
    });
    app.querySelectorAll("[data-resume]").forEach(b => b.addEventListener("click", () => { audio(); resumeGame(+b.dataset.resume); }));
    app.querySelectorAll("[data-delete]").forEach(b => b.addEventListener("click", () => set({ dialog: { type: "deleteSaved", id: +b.dataset.delete } })));
    el("#startBtn").addEventListener("click", () => {
      audio();
      state.players.forEach(p => { p.score = 0; p.level = 1; p.target = randomTarget(1); p.remaining = state.x01.start; p.legs = 0; p.dartsThrown = 0; p.pointsScored = 0; p.last = null; });
      set({ screen: "play", current: 0, rounds: [], result: null, winner: null, round: 1, dialog: null, entry: "", msg: "", legStarter: 0, leg: 1, undo: [] });
      speak(state.mode === "bull" ? "Game on." : `Game on. ${state.x01.start}.`);

  }

  function wireCommon() {
    const v = el("#voiceBtn"); if (v) v.addEventListener("click", () => { set({ voice: !state.voice }); if (state.voice) speak("Caller on."); else if (canSpeak) speechSynthesis.cancel(); });
    if (state.dialog) { if (!el(".dialog")) app.insertAdjacentHTML("beforeend", renderDialog(state.dialog)); wireDialog(); }
  }

  function renderDialog(d) {
    let title, text, ok, okClass = "red";
    if (d.type === "end") { title = "End this game?"; text = "Scores will be lost. Use Save and close instead if you want to pick it up later."; ok = "End game"; }
    else if (d.type === "leave") { const p = state.players[d.index]; title = `${p ? esc(p.name) : "Player"} leaving?`; text = "They drop out of the game. Everyone else carries on and their throws stay in the history."; ok = "Yes, leave the game"; }
    else if (d.type === "deleteSaved") { const s = savedGames.find(g => g.id === d.id); title = "Delete saved game?"; text = s ? `${esc(s.title)}. This can't be undone.` : ""; ok = "Delete"; }
    else if (d.type === "save") { title = "Save and close?"; text = "The game is kept on this device under Saved games on the start screen. Resume it any time."; ok = "Save and close"; okClass = ""; }
    return `<div class="dialog" role="dialog" aria-label="${title}"><div class="inner">
      <h3>${title}</h3><p>${text}</p>
      <div class="actions"><button class="btn ${okClass}" id="dlgOk" type="button">${ok}</button><button class="btn quiet" id="dlgCancel" type="button">Go back</button></div>
    </div></div>`;
  }
  function wireDialog() {
    const d = state.dialog;
    el("#dlgCancel").addEventListener("click", () => set({ dialog: null }));
    el("#dlgOk").addEventListener("click", () => {
      if (d.type === "end") resetToSetup();
      else if (d.type === "leave") leaveGame(d.index);
      else if (d.type === "deleteSaved") { savedGames = savedGames.filter(g => g.id !== d.id); set({ dialog: null }); }
      else if (d.type === "save") saveGame();
    });
  }

  function playMeta(chips) {
    meta.innerHTML = chips + voiceButton() + (SR ? `<button class="btn-ghost" id="voiceCtl" type="button" aria-pressed="${state.listenMode}" title="Say scores instead of typing">${state.listenMode ? "🎤 Voice control on" : "🎤 Voice control"}</button>` : "") + `<button class="btn-ghost" id="undoBtn" type="button" ${state.undo && state.undo.length ? "" : "disabled"} title="Put the last throw back">↶ Undo</button><button class="btn-ghost" id="saveBtn" type="button">Save and close</button><button class="btn-ghost" id="quitBtn" type="button">End game</button>`;
  }
  function scoreboardBull() {
    return `<div class="players">${[...state.players].map((q, i) => ({ q, i })).sort((a, b) => b.q.score - a.q.score).map(({ q, i }) => `
      <div class="pcard${i === state.current ? " active" : ""}">
        ${avatar(q)}
        <div><div class="pname">${esc(q.name)}${q.bot ? ` <span class="lvl">bot ${q.botLevel}</span>` : ""}</div><div class="sub">${pips(q.level)}<span class="lvl">Lvl ${q.level}</span><span class="tgt">next <b>${q.target}</b></span></div></div>
        <div class="score"><div class="n">${q.score}</div><div class="bar"><i style="width:${Math.min(100, q.score / state.targetScore * 100)}%"></i></div></div>
        ${state.players.length > 1 ? `<button type="button" class="leave" data-leave="${i}">Leave game</button>` : ""}
      </div>`).join("")}</div>`;
  }
  function scoreboardX01() {
    return `<div class="players">${state.players.map((q, i) => `
      <div class="pcard${i === state.current ? " active" : ""}">
        ${avatar(q)}
        <div><div class="pname">${esc(q.name)}${q.bot ? ` <span class="lvl">bot ${q.botLevel}</span>` : ""}</div><div class="sub">${state.x01.legs > 1 ? legDots(q.legs, state.x01.legs) : ""}<span class="tgt">avg <b>${avg(q)}</b></span><span class="tgt">last <b>${q.last == null ? "–" : q.last}</b></span></div></div>
        <div class="score"><div class="n">${q.remaining}</div><div class="bar"><i style="width:${Math.min(100, (state.x01.start - q.remaining) / state.x01.start * 100)}%"></i></div></div>
        ${state.players.length > 1 ? `<button type="button" class="leave" data-leave="${i}">Leave game</button>` : ""}
      </div>`).join("")}</div>`;
  }
  function historyList(emptyText) {
    if (!state.rounds.length) return `<p class="empty">${emptyText}</p>`;
    return `<ul class="history">${[...state.rounds].reverse().map(r => {
      if (r.left) return `<li class="neutral"><span class="who"><b>${esc(r.player)}</b> left the game</span><span class="r">round ${r.round}</span></li>`;
      if (r.legWon) return `<li class="hit"><span class="who"><b>${esc(r.player)}</b> wins leg ${r.leg} on ${r.darts} dart${r.darts > 1 ? "s" : ""}</span><span class="r hit">${r.scored} out</span></li>`;
      if (state.mode === "x01") return `<li class="${r.bust ? "miss" : r.scored >= 100 ? "hit" : "neutral"}"><span class="who"><b>${esc(r.player)}</b> · ${r.bust ? "bust, still needs " + r.remaining : "leaves " + r.remaining}</span><span class="r ${r.bust ? "miss" : r.scored >= 100 ? "hit" : ""}">${r.bust ? "bust" : r.scored}</span></li>`;
      if (r.saved) return `<li class="neutral"><span class="who"><b>${esc(r.player)}</b> · saved by the bull on ${r.target}, level ${r.fromLevel}</span><span class="r">0 → L${r.level}</span></li>`;
      return `<li class="${r.hit ? "hit" : "miss"}"><span class="who"><b>${esc(r.player)}</b> · ${r.hit ? "hit" : "missed"} ${r.target} on level ${r.fromLevel}</span><span class="r ${r.hit ? "hit" : "miss"}">${r.hit ? "+" + r.delta : (r.delta ? "−" + r.delta : "0")} → L${r.level}</span></li>`;
    }).join("")}</ul>`;
  }
  function wirePlay() {
    el("#saveBtn").addEventListener("click", () => set({ dialog: { type: "save" } }));
    el("#quitBtn").addEventListener("click", () => set({ dialog: { type: "end" } }));
    el("#undoBtn").addEventListener("click", undo);
    app.querySelectorAll("[data-undo]").forEach(b => b.addEventListener("click", undo));
    const vc = el("#voiceCtl"); if (vc) vc.addEventListener("click", () => setVoiceControl(!state.listenMode));
    const vl = el("#voiceLine"); if (vl) { vl.textContent = state.listenMode ? (heardText || "Listening…") : ""; vl.classList.toggle("live", !!state.listenMode); }
    // hands-free: move on by itself a few seconds after a result, unless someone undoes or taps first
    const cur = state.players[state.current];
    if ((state.listenMode || (cur && cur.bot)) && state.result && !state.result.checkout && state.winner == null) {
      const token = state.result;
      setTimeout(() => { if (state.result === token && state.screen === "play" && !state.dialog) nextTurn(); }, cur && cur.bot ? 3800 : 3000);
    }
    scheduleBot();
    app.querySelectorAll("[data-leave]").forEach(b => b.addEventListener("click", () => set({ dialog: { type: "leave", index: +b.dataset.leave } })));
    const nextBtn = el("#nextBtn"); if (nextBtn) nextBtn.addEventListener("click", nextTurn);
    const againBtn = el("#againBtn"); if (againBtn) againBtn.addEventListener("click", playAgain);
    const changeBtn = el("#changeBtn"); if (changeBtn) changeBtn.addEventListener("click", resetToSetup);
    wireCommon();
  }

  // ----- Saved by the Bull play screen -----
  function renderPlayBull() {
    const p = state.players[state.current];
    const L = LEVELS[p.level - 1];
    playMeta(`<span class="chip">First to <strong>${state.targetScore}</strong></span><span class="chip">Round <strong>${state.round}</strong></span>`);
    app.innerHTML = `
      <section class="play">
        <div>
          <div class="turn">
            <div class="turn-head">
              <div class="who">${avatar(p)}<div><div class="label">On the oche</div><div class="pname">${esc(p.name)}</div></div></div>

                ${CHECKOUTS[p.target] ? `<div class="worth" style="margin-top:6px">Route: <b>${routePretty(CHECKOUTS[p.target])}</b></div>` : ""}
              </div>

              <button class="btn red" id="missBtn" type="button">Missed<small>${L.penalty ? "−" + L.penalty : "0"}${L.failTo < L.level ? ` · back to level ${L.failTo}` : " · stays on level 1"}</small></button>
            </div>
            <p class="hint">Throw three darts, then press one. If the checkout is no longer possible with the darts left, throw for the bull: hit it and you're saved. Keyboard: H hit, B bull, M missed.${SR ? " With voice control on, just say \"hit\", \"miss\" or \"bull\"." : ""}</p>

    drawBoard(el("#board"));

  function renderResultBull(r) {

  }

  function renderWinner() {
    const w = state.players[state.winner];
    const line = state.mode === "bull" ? `${w.score} points · first to ${state.targetScore}` : (state.x01.legs > 1 ? `${w.legs} leg${w.legs > 1 ? "s" : ""} · first to ${state.x01.legs}` : `${state.x01.start} · ${avg(w)} average`);
    return `<div class="winner" role="dialog" aria-label="Winner"><div class="inner">
        ${avatar(w)}
        <div class="eyebrow">${state.mode === "bull" ? "Saved by the Bull" : "Game, shot and the match"}</div>
        <div class="name">${esc(w.name)} wins!</div>
        <div class="pts">${line}</div>
        <div class="actions">
          <button class="btn" id="againBtn" type="button">Play again, same players</button>
          <button class="btn brass" id="changeBtn" type="button">Change players</button>
        </div>
        ${state.undo && state.undo.length ? `<button type="button" class="undo" data-undo="1" style="color:#6b5a2c">Wrong score? Undo the last throw</button>` : ""}
    </div></div>`;
  }

  // ---------- undo ----------
  // A snapshot is taken before every throw is recorded; Undo puts the game back exactly as it was.
  function snapshot(label) {
    const snap = { label, players: JSON.parse(JSON.stringify(state.players)), current: state.current, rounds: state.rounds.slice(), round: state.round, leg: state.leg, legStarter: state.legStarter };
    state.undo = (state.undo || []).concat([snap]).slice(-30);
  }
  function undo() {
    if (!state.undo || !state.undo.length || state.dialog) return;
    const snap = state.undo[state.undo.length - 1];
    state.undo = state.undo.slice(0, -1);
    if (canSpeak) { try { speechSynthesis.cancel(); } catch (e) { /* ignore */ } }
    set({ players: snap.players, current: snap.current, rounds: snap.rounds, round: snap.round, leg: snap.leg, legStarter: snap.legStarter, result: null, winner: null, entry: "", msg: `Undone: ${snap.label}. ${state.players[snap.current] ? state.players[snap.current].name : ""} to throw again.` });
    speak(`Undone. ${state.players[state.current].name} to throw again.`);
  }
  function undoLink() { return state.undo && state.undo.length ? `<button type="button" class="undo" data-undo="1">Wrong? Undo that</button>` : ""; }

  // ---------- celebrations ----------
  function confetti(n) {
    const box = document.createElement("div"); box.className = "confetti";
    const cols = ["#ff4d3d", "#ffd45c", "#37d67a", "#4da3ff", "#fff4d6", "#ff8c2e"];
    for (let i = 0; i < (n || 80); i++) {
      const p = document.createElement("i");
      p.style.left = Math.random() * 100 + "vw"; p.style.background = cols[i % cols.length];
      p.style.animationDuration = (1.6 + Math.random() * 1.6) + "s"; p.style.animationDelay = (Math.random() * .6) + "s";
      p.style.transform = `rotate(${Math.random() * 360}deg)`; p.style.width = (6 + Math.random() * 8) + "px";
      box.appendChild(p);
    }
    document.body.appendChild(box); setTimeout(() => box.remove(), 3600);
    document.body.classList.remove("flash"); void document.body.offsetWidth; document.body.classList.add("flash");
  }
  function big180(name) {
    sfx.crowd(2.6); confetti(120);
    playClip("180").then(played => { if (!played) speak("ONE HUNDRED AND EIGHTYYYY!", { pitch: 1.15, rate: 0.8 }); });
  }
  const numberWord = n => n === 100 ? "a ton" : n === 140 ? "ton forty" : n === 160 ? "ton sixty" : String(n);
  // The line the caller says after a scoring visit in 501
  function callVisit(scored, p, s) {
    // With voice control on the caller only echoes the score it heard; the screen shows the rest.
    const tail = state.listenMode ? "" : ` ${p.name}, you require ${p.remaining}.` + (s && s.finish ? " " + routeWords(s.route) + "." : "");
    if (scored === 180) { big180(p.name); speak(tail, { queue: true }); return; }
    if (scored >= 171) { sfx.crowd(1.6); speak(`${scored}! Wonderful darts!`, { pitch: 1.1, rate: 0.9 }); speak(tail, { queue: true }); return; }
    if (scored >= 140) { sfx.crowd(1.4); speak(`${numberWord(scored)}!`, { pitch: 1.08, rate: 0.9 }); speak(tail, { queue: true }); return; }
    if (scored >= 100) { playClip("ton").then(played => { if (!played) speak(`${numberWord(scored)}!`, { pitch: 1.04 }); speak(tail, { queue: true }); }); return; }
    if (scored === 26) { speak("Twenty six. Bed and breakfast."); speak(tail, { queue: true }); return; }
    speak(callScore(scored) + tail);
  }

  // ---------- game flow: Saved by the Bull ----------
  // outcome: "hit" | "miss" | "bull" (checkout impossible with the darts left, but the bull was hit: nothing changes)
  function submitBull(outcome) {
    if (state.result || state.dialog || state.winner != null) return;
    const p = state.players[state.current];
    const L = LEVELS[p.level - 1];
    const before = p.level;
    const hit = outcome === "hit", saved = outcome === "bull";
    snapshot(`${p.name} ${hit ? "hit" : saved ? "saved by the bull on" : "missed"} ${p.target}`);
    let delta = 0;
    if (hit) { delta = L.points; p.score += delta; if (p.level < 5) p.level++; sfx.hit(); if (before >= 4) { sfx.crowd(1.6); confetti(60); } }
    else if (saved) { sfx.hit(); sfx.crowd(1.4); }
    else { delta = L.penalty; p.score = Math.max(0, p.score - delta); p.level = L.failTo; sfx.miss(); }
    const usedTarget = p.target;
    if (!(saved && state.bullKeep)) p.target = randomTarget(p.level);
    const result = { player: p.name, hit, saved, delta, level: p.level, fromLevel: before, levelUp: p.level > before, levelDown: p.level < before, score: p.score, target: usedTarget, round: state.round };
    state.rounds.push(result);
    if (p.score >= state.targetScore) { state.winner = state.current; state.result = null; set({}); setTimeout(sfx.win, 150); sfx.crowd(3); confetti(150); playClip("gameshot").then(pl => { if (!pl) speak(`GAME SHOT! ${p.name} wins with ${p.score} points!`, { pitch: 1.12, rate: 0.85 }); }); return; }
    if (state.listenMode && !saved && !(hit && before >= 4)) speak(hit ? "Hit." : "Missed.");
    else if (hit && before === 5) speak(`WHAT A CHECKOUT! ${usedTarget}! ${delta} points. ${p.name} has ${p.score}.`, { pitch: 1.12, rate: 0.85 });
    else if (hit && before === 4) speak(`Yes! ${usedTarget}! ${delta} points. ${p.name} has ${p.score}.`, { pitch: 1.06 });
    else if (hit) speak(`Hit! ${delta} points. ${p.name} has ${p.score}.`);
    else if (saved) playClip("saved").then(pl => { if (!pl) speak(`SAVED BY THE BULL! ${p.name} stays on level ${p.level}.`, { pitch: 1.1, rate: 0.88 }); });
    else speak(delta ? `Missed. Minus ${delta}. ${p.name} has ${p.score}.` : `Missed. No points lost.`);
    set({ result });
  }

  // ---------- game flow: 501 ----------
  function submitX01(scored) {
    if (state.result || state.dialog || state.winner != null) return;
    const p = state.players[state.current];
    let bust = scored === "bust";
    if (!bust) {
      if (!(scored >= 0 && scored <= 180)) { set({ msg: "A three-dart score is 0 to 180." }); return; }
      if (IMPOSSIBLE_SCORES.has(scored)) { set({ msg: `${scored} can't be scored with three darts.` }); return; }
      const left = p.remaining - scored;
      if (left < 0 || left === 1) bust = true;
      else if (left === 0) {
        if (scored > 170 || !CHECKOUTS[scored]) { set({ msg: `${scored} isn't a finish. Enter what you scored, or Bust.` }); return; }
        snapshot(`${p.name} checked out ${scored}`);
        p.remaining = 0; p.pointsScored += scored;
        const r = { player: p.name, scored, checkout: true, leg: state.leg };
        sfx.hit(); sfx.crowd(2.4); confetti(scored >= 100 ? 140 : 70);
        const key = scored === 170 ? "bigfish" : "gameshot";
        playClip(key).then(pl => { if (!pl) speak(scored === 170 ? "THE BIG FISH! ONE HUNDRED AND SEVENTY! GAME SHOT!" : scored >= 100 ? `WHAT A FINISH! ${scored}! GAME SHOT!` : "GAME SHOT!", { pitch: 1.12, rate: 0.85 }); });
        set({ result: r, entry: "", msg: "" });
        return;
      }
    }
    snapshot(`${p.name} ${bust ? "bust" : "scored " + scored}`);
    const pointsHit = bust ? 0 : scored;
    if (!bust) p.remaining -= scored;
    p.dartsThrown += 3; p.pointsScored += pointsHit; p.last = bust ? 0 : scored;
    const s = suggestion(p.remaining);
    const r = { player: p.name, scored: bust ? 0 : scored, bust, remaining: p.remaining, suggest: s ? (s.finish ? routePretty(s.route) : s.route) : "" };
    state.rounds.push(r);
    if (bust) { sfx.miss(); playClip("bust").then(pl => { if (state.listenMode) { if (!pl) speak("Bust."); } else if (!pl) speak(`No score! Bust. ${p.name} still requires ${p.remaining}.`); else speak(`${p.name} still requires ${p.remaining}.`, { queue: true }); }); }
    else { if (scored >= 100) sfx.hit(); else sfx.tap(); callVisit(scored, p, s); }
    set({ result: r, entry: "", msg: "" });
  }
  function finishLeg(darts) {
    const p = state.players[state.current];
    const scored = state.result ? state.result.scored : 0;
    snapshot(`${p.name} won leg ${state.leg}`);
    p.dartsThrown += darts; p.legs++;
    state.rounds.push({ player: p.name, legWon: true, leg: state.leg, darts, scored });
    if (p.legs >= state.x01.legs) { state.winner = state.current; state.result = null; set({}); setTimeout(sfx.win, 150); sfx.crowd(3); confetti(160); speak(`GAME, SHOT, AND THE MATCH! ${p.name}!`, { pitch: 1.12, rate: 0.82 }); return; }
    speak(`${p.name} takes leg ${state.leg}.`, { pitch: 1.05 });
    // next leg: everyone back to the start, the starter alternates
    state.players.forEach(q => { q.remaining = state.x01.start; q.last = null; });
    const starter = (state.legStarter + 1) % state.players.length;
    set({ leg: state.leg + 1, legStarter: starter, current: starter, result: null, rounds: [], entry: "", msg: "" });
    announceTurn();
  }

  // ---------- shared flow ----------
  function nextTurn() {
    if (state.winner != null) return;
    const next = (state.current + 1) % state.players.length;
    set({ current: next, result: null, entry: "", msg: "", botDarts: "", round: next === 0 ? state.round + 1 : state.round });
    announceTurn();
  }
  function leaveGame(index) {
    const p = state.players[index]; if (!p) { set({ dialog: null }); return; }
    state.rounds.push({ player: p.name, left: true, round: state.round });
    state.players.splice(index, 1);
    if (!state.players.length) { resetToSetup(); return; }
    let current = state.current;
    if (index < current) current--;
    if (current >= state.players.length) current = 0;
    let starter = state.legStarter; if (index < starter) starter--; if (starter >= state.players.length) starter = 0;
    set({ current, legStarter: starter, result: index === state.current ? null : state.result, dialog: null, entry: "", msg: "" });
  }
  function resetPlayers() {
    state.players.forEach(p => { p.score = 0; p.level = 1; p.target = randomTarget(1); p.remaining = state.x01.start; p.legs = 0; p.dartsThrown = 0; p.pointsScored = 0; p.last = null; });
  }
  function playAgain() {
    resetPlayers();
    set({ current: 0, rounds: [], result: null, winner: null, round: 1, dialog: null, entry: "", msg: "", legStarter: 0, leg: 1, undo: [] });
    speak("Game on."); announceTurn();
  }
  function resetToSetup() {
    resetPlayers();
    stopListening(); state.listenMode = false;
    if (canSpeak) speechSynthesis.cancel();
    set({ screen: "setup", current: 0, rounds: [], result: null, winner: null, round: 1, dialog: null, entry: "", msg: "", legStarter: 0, leg: 1, undo: [] });
  }

  // keyboard shortcuts during play
  document.addEventListener("keydown", e => {
    if (state.screen !== "play" || state.winner != null) return;
    if (e.target && (e.target.tagName === "INPUT")) return;
    if (state.dialog) { if (e.key === "Escape") set({ dialog: null }); return; }
    if (e.key.toLowerCase() === "u" || (e.key.toLowerCase() === "z" && (e.metaKey || e.ctrlKey))) { e.preventDefault(); undo(); return; }
    if (state.result) {
      if (state.result.checkout && /^[1-3]$/.test(e.key)) { e.preventDefault(); finishLeg(+e.key); return; }
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); nextTurn(); }
      return;
    }
    if (state.mode === "bull") {
      const k = e.key.toLowerCase();
      if (k === "h") { e.preventDefault(); submitBull("hit"); } else if (k === "m") { e.preventDefault(); submitBull("miss"); } else if (k === "b") { e.preventDefault(); submitBull("bull"); }
    } else {
      if (/^[0-9]$/.test(e.key)) { e.preventDefault(); const s = state.entry; if (s.length < 3) set({ entry: (s === "0" ? "" : s) + e.key, msg: "" }); }
      else if (e.key === "Backspace") { e.preventDefault(); set({ entry: state.entry.slice(0, -1) }); }
      else if (e.key === "Enter" && state.entry !== "") { e.preventDefault(); submitX01(parseInt(state.entry, 10)); }
      else if (e.key.toLowerCase() === "b") { e.preventDefault(); submitX01("bust"); }
    }
  });

  render();
})();
</script>
